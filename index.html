<style id="cv-styles">
*{box-sizing:border-box;margin:0;padding:0}
.page{font-family:var(--font);font-size:calc(var(--fs)*1px);line-height:1.5;width:210mm;min-height:297mm;background:var(--bg);color:var(--soft);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.page a{color:inherit;text-decoration:none}.page ul{list-style:none}
.page h1{font-size:2.5em;font-weight:800;color:var(--ink);line-height:1.1;letter-spacing:-.02em}
.role{margin-top:.3em;font-size:1.05em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.contact-line,.availability{margin-top:.5em}.availability{font-style:italic}
.links-line{display:flex;flex-wrap:wrap;gap:.2em 1.2em;margin-top:.2em;color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:.8em;margin-top:1.2em}
.stat{flex:1;min-width:8em;background:var(--tint);border-left:3px solid var(--accent);padding:.7em 1em;border-radius:3px}
.stat-value{font-size:1.8em;font-weight:800;color:var(--accent);line-height:1}
.stat-label{font-size:.88em;margin-top:.3em;line-height:1.3}
.section{margin-top:calc(1.3em*var(--sp))}
.section-title{font-size:.95em;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);padding-bottom:.4em;margin-bottom:.8em;border-bottom:1.5px solid var(--accent)}
.profil-text{text-align:justify}
.entry{margin-bottom:calc(.9em*var(--sp))}
.entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:1em}
.entry-title{font-size:1.08em;font-weight:700;color:var(--ink)}
.entry-date{font-size:.92em;font-weight:600;color:var(--accent);white-space:nowrap}
.entry-org{font-style:italic}
.bullets{margin-top:.3em}.bullets li{position:relative;padding-left:1em;margin-bottom:.15em}
.bullets li:before{content:'';position:absolute;left:0;top:.6em;width:.33em;height:.33em;border-radius:50%;background:var(--accent)}
.bullets li strong{color:var(--ink)}
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7em 1.5em}
.skill-name,.formation-title{font-weight:700;color:var(--ink)}
.formation-year{font-weight:700;color:var(--accent);font-size:.9em}.formation-entry{margin-bottom:.5em}
.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 1.5em}
.chips{display:flex;flex-wrap:wrap;gap:.5em}
.chip{font-size:.9em;font-weight:600;padding:.25em .75em;border-radius:99px;background:var(--tint);color:var(--accent);border:1px solid var(--rule)}
.single{padding:var(--pad)}
.head{display:flex;justify-content:space-between;gap:1em;align-items:center}
.avatar{width:5.5em;height:5.5em;border-radius:50%;overflow:hidden;border:2px solid var(--accent);flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}

/* Minimal */
.t-minimal .head{flex-direction:column;text-align:center}
.t-minimal h1{font-family:'Playfair Display',serif;font-weight:500;font-size:2.8em}
.t-minimal .role{color:var(--soft);letter-spacing:.25em}.t-minimal .links-line{justify-content:center}
.t-minimal .stats{justify-content:center;padding:.8em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.t-minimal .stat{background:none;border:0;text-align:center;flex:none}
.t-minimal .stat-value{color:var(--ink);font-family:'Playfair Display',serif}
.t-minimal .section-title{color:var(--ink);border-bottom:1px solid var(--ink)}
.t-minimal .bullets li:before{border-radius:0;background:var(--ink)}
.t-minimal .chip{background:none;border:0;color:var(--soft);padding:0}
.t-minimal .chip:not(:last-child):after{content:' ·';margin-left:.5em}
/* Bold */
.t-bold .head{background:var(--band);color:#fff;margin:calc(-1*var(--pad)) calc(-1*var(--pad)) 0;padding:var(--pad)}
.t-bold h1{color:#fff}.t-bold .role,.t-bold .links-line{color:var(--accent-light)}
.t-bold .section-title{border:0;background:var(--tint);border-left:4px solid var(--accent);padding:.4em .7em}
/* Classic */
.t-classic h1{font-family:'Merriweather',serif;font-weight:700;font-size:2.2em;letter-spacing:0}
.t-classic .head{border-bottom:3px double var(--ink);padding-bottom:.8em}
.t-classic .role{letter-spacing:.05em;text-transform:none;color:var(--ink);font-weight:600}
.t-classic .stat{background:none;border:0;padding:0;border-radius:0}.t-classic .stat-value{color:var(--ink);font-size:1.4em}
.t-classic .section-title{color:var(--ink);border-bottom:1px solid var(--ink)}
.t-classic .bullets li:before{background:var(--ink)}
/* Sidebar */
.t-sidebar{display:grid;grid-template-columns:30% 1fr}
.t-sidebar .sidebar{background:var(--band);color:#e8ecef;padding:calc(var(--pad)*1.6) calc(var(--pad)*.8)}
.side-label{font-size:.9em;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-light);font-weight:700;margin-bottom:.6em}
.side-block{margin-bottom:1.5em}.side-item{margin-bottom:.6em;word-break:break-word}.side-item strong{display:block;color:#fff}
.side-links{display:flex;flex-direction:column;gap:.5em;word-break:break-all}
.t-sidebar .sidebar .avatar{margin:0 auto 1.8em;width:7em;height:7em}
.t-sidebar .formation-title{color:#fff}.t-sidebar .formation-year{color:var(--accent-light)}.t-sidebar .formation-school{opacity:.8}
.t-sidebar .chip{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
.t-sidebar .content{padding:calc(var(--pad)*1.6) var(--pad)}
.t-sidebar .entry{padding-left:1em;border-left:2px solid var(--accent)}
.t-sidebar .entry-head{display:block}
/* Modern */
.t-modern{display:grid;grid-template-columns:1fr 32%;grid-template-rows:auto 1fr}
.t-modern .m-head{grid-column:1/-1;background:var(--band);color:#fff;padding:var(--pad) var(--pad) calc(var(--pad)*.7)}
.t-modern .m-head h1{color:#fff}.t-modern .m-head .role{color:var(--accent-light)}
.t-modern .m-head .stat{background:rgba(255,255,255,.08);border-color:var(--accent-light)}.t-modern .m-head .stat-value{color:#fff}
.t-modern .main{padding:calc(var(--pad)*.6) calc(var(--pad)*.6) var(--pad) var(--pad)}
.t-modern .aside{background:var(--tint);padding:calc(var(--pad)*.6) var(--pad) var(--pad) calc(var(--pad)*.6)}
.t-modern .section-title{border:0;display:flex;gap:.6em;align-items:center}
.t-modern .section-title:after{content:'';flex:1;height:1px;background:var(--rule)}
.t-modern .entry{padding-left:.9em;border-left:2px solid var(--accent)}.t-modern .entry-head{display:block}
.t-modern .skills-grid,.t-modern .two-cols{display:block}.t-modern .skill{margin-bottom:.6em}
.t-modern .links-col{display:flex;flex-direction:column;gap:.3em;color:var(--accent);word-break:break-all}
.t-modern .side-item strong{font-size:.9em;text-transform:uppercase;letter-spacing:.08em;color:var(--ink)}
@media print{.page{box-shadow:none}}
</style>

<style>
body{font-family:'Lato',sans-serif;background:#14181a;color:#d7dadb;display:flex;height:100vh;margin:0;overflow:hidden}
.editor{width:480px;flex-shrink:0;background:#1c2226;display:flex;flex-direction:column;border-right:1px solid #2a3236}

h2{margin:0;color:#a8763c;font-size:14px;text-transform:uppercase;letter-spacing:1px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.controls{padding:10px 16px;border-bottom:1px solid #2a3236;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:#9aa3a7;max-height:48vh;overflow:auto}
.theme-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.theme-btn{padding:7px 4px;font-size:12px}.theme-btn.active{background:#a8763c;border-color:#a8763c;color:#fff}
details{border:1px solid #2a3236;border-radius:5px;padding:6px 10px}summary{cursor:pointer;color:#d7dadb;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;margin-top:8px}
input[type=color]{width:38px;height:24px;border:none;background:none;padding:0;cursor:pointer}
input[type=range]{width:160px;accent-color:#a8763c}select{background:#0e1113;color:#d7dadb;border:1px solid #3a444a;border-radius:4px;padding:5px}
.palettes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pal{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11.5px}.pal i{width:12px;height:12px;border-radius:50%;display:inline-block}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px}.checks label,.check-row{display:flex;align-items:center;gap:7px}
.check-row input,.checks input{accent-color:#a8763c}
#pageInfo{margin-left:auto;font-weight:700;color:#7fbf82}#pageInfo.warn{color:#e0a84f}
#jsonInput{flex:1;background:#0e1113;color:#c5e3c8;border:none;padding:16px;font-family:monospace;font-size:12.5px;line-height:1.5;resize:none;outline:none}
.preview-wrap{flex:1;overflow:auto;padding:30px 20px;background:#0f1214;display:flex;justify-content:center;align-items:flex-start}
button{background:#2a3236;color:#d7dadb;border:1px solid #3a444a;border-radius:4px;padding:7px 11px;cursor:pointer;font-family:inherit;font-size:12.5px}button:hover{background:#3a444a}
#status{padding:9px 16px;font-size:12px;border-top:1px solid #2a3236}#status.ok{color:#7fbf82}#status.error{color:#d9776a}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-12px);background:#3a1f1f;color:#f2b8ae;border:1px solid #6b3630;padding:10px 18px;border-radius:6px;font-size:13px;max-width:80vw;opacity:0;pointer-events:none;transition:.25s;z-index:1000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.page-box{position:relative;flex-shrink:0}.page-box .page{position:absolute;left:0;top:0;transform-origin:0 0}
.page-guides{position:absolute;left:0;right:0;top:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(297mm - 2px),#e11d48 calc(297mm - 2px),#e11d48 297mm);-webkit-mask-image:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 14px);mask-image:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 14px)}
@media print{@page{size:A4;margin:0}.page-guides,.editor,#toast{display:none!important}.page-box{width:210mm!important}body{display:block;height:auto;overflow:visible;background:#fff}.preview-wrap{padding:0;overflow:visible;display:block;background:#fff}.page{box-shadow:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<body>
<div class="editor">
  <div class="editor-header">
    <h2>CV Studio</h2>
    <div class="btns">
      <select id="presetSel" title="Modèles de contenu"></select>
      <button id="btnReset" title="Recharger le modèle choisi">↺</button>
      <button id="btnCopy">📋 HTML</button>
      <button id="btnDownload">⬇️ HTML</button>
      <button id="btnPdf" title="PDF A4 (texte sélectionnable, liens cliquables)">⬇️ PDF</button>
      <button id="btnPrint" title="Impression du navigateur">🖨️</button>
    </div>
  </div>
  <div class="controls">
    <div>Design</div>
    <div class="theme-picker" id="themePicker"></div>
    <details open><summary>🎨 Couleurs</summary>
      <div class="palettes" id="palettes"></div>
      <div class="grid2">
        <span>Accent</span><input type="color" id="accentInput">
        <span>Titres (nom, intitulés)</span><input type="color" id="cInk">
        <span>Texte courant</span><input type="color" id="cText">
        <span>Bandeaux / colonne latérale (foncé conseillé)</span><input type="color" id="cBand">
        <span>Fond de la page</span><input type="color" id="cBg">
      </div>
    </details>
    <details><summary>🔤 Police et mise en page</summary>
      <div class="grid2">
        <span>Police</span><select id="cFont"></select>
        <span>Taille du texte</span><input type="range" id="cSize" min="9.5" max="14" step=".25">
        <span>Espacement</span><input type="range" id="cSpace" min=".6" max="1.6" step=".05">
        <span>Marges</span><input type="range" id="cMargin" min="8" max="24" step="1">
      </div>
    </details>
    <details><summary>👁️ Sections affichées</summary><div class="checks" id="sectionChecks"></div></details>
    <div class="check-row"><input type="checkbox" id="onePage"><label for="onePage">Tout sur 1 page (réduit si besoin)</label><span id="pageInfo"></span></div>
  </div>
  <textarea id="jsonInput" spellcheck="false"></textarea>
  <div id="status">Prêt</div>
</div>
<div class="preview-wrap"><div class="page-box" id="pageBox"><div class="page" id="preview"></div><div class="page-guides" id="pageGuides" title="Fin de page A4"></div></div></div>
<div id="toast"></div>

function vars(d){
  const s = Object.assign({}, STYLE_DEF, d.style||{}), a = accentOf(d);
  return `--accent:${a};--accent-light:${mix(a,.45)};--tint:${mix(a,.09)};--rule:${mix(a,.22)};--ink:${s.ink};--soft:${s.text};--band:${s.band};--bg:${s.bg};--font:${FONTS[s.font]||FONTS.Inter};--fs:${s.size};--sp:${s.space};--pad:${s.margin}mm;`;
}
function faviconUrl(a){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='${a}'/><rect x='15' y='10' width='34' height='44' rx='4' fill='#fff'/><circle cx='26' cy='24' r='5' fill='${a}'/><rect x='34' y='20' width='10' height='3' rx='1.5' fill='${a}'/><rect x='34' y='26' width='8' height='2.5' rx='1.2' fill='#b8c0c6'/><rect x='20' y='36' width='24' height='3' rx='1.5' fill='#b8c0c6'/><rect x='20' y='43' width='18' height='3' rx='1.5' fill='#b8c0c6'/></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}

/* ---------- Blocs ---------- */
const contactParts = d => { const c=d.contact||{}; return [c.location,c.phone,c.email].filter(has); };
const statsHtml = d => arr(d.stats).length ? `<div class="stats">${d.stats.map(x=>`<div class="stat"><div class="stat-value">${esc(x.value)}</div><div class="stat-label">${esc(x.label)}</div></div>`).join("")}</div>` : "";
const linksInline = d => arr(d.links).length ? `<div class="links-line">${d.links.map(x=>`<a href="${esc(x.url)}">${esc(x.label)}</a>`).join("")}</div>` : "";
const expHtml = d => arr(d.experience).map(e=>`<div class="entry"><div class="entry-head"><div class="entry-title">${esc(e.title)}</div><div class="entry-date">${esc(e.date)}</div></div>${has(e.org)?`<div class="entry-org">${esc(e.org)}</div>`:""}${arr(e.bullets).length?`<ul class="bullets">${e.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`:""}</div>`).join("");
const projHtml = d => arr(d.projects).length ? `<ul class="bullets">${d.projects.map(x=>`<li><strong>${esc(x.name)}</strong> : ${esc(x.desc)}</li>`).join("")}</ul>` : "";
const skillsHtml = d => arr(d.skills).length ? `<div class="skills-grid">${d.skills.map(x=>`<div class="skill"><div class="skill-name">${esc(x.name)}</div><div class="skill-value">${esc(x.value)}</div></div>`).join("")}</div>` : "";
const formHtml = d => arr(d.formation).map(f=>`<div class="formation-entry">${has(f.year)?`<div class="formation-year">${esc(f.year)}</div>`:""}<div class="formation-title">${esc(f.title)}</div><div class="formation-school">${esc(f.school)}</div></div>`).join("");
const softHtml = d => arr(d.softSkills).length ? `<div class="chips">${d.softSkills.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>` : "";
const profileHtml = d => has(d.profile) ? `<p class="profil-text">${esc(d.profile)}</p>` : "";
const sec = (d,key,title,body) => (body && show(d,key)) ? `<section class="section"><div class="section-title">${esc(title)}</div>${body}</section>` : "";
const headerHtml = d => `<h1>${esc(FIXED.fullName)}</h1>${has(d.role)?`<div class="role">${esc(d.role)}</div>`:""}${has(d.availability)?`<div class="availability">${esc(d.availability)}</div>`:""}`;
const avatarHtml = d => has(d.avatarUrl) ? `<div class="avatar"><img src="${esc(d.avatarUrl)}" alt=""></div>` : "";
const sideItems = (pairs) => pairs.filter(x=>has(x[1])).map(x=>`<div class="side-item"><strong>${esc(x[0])}</strong>${esc(x[1])}</div>`).join("");

function renderSingle(d){
  return `<div class="single"><header class="head"><div>${headerHtml(d)}<div class="contact-line">${contactParts(d).map(esc).join(" · ")}</div>${show(d,"liens")?linksInline(d):""}</div>${avatarHtml(d)}</header>
  ${show(d,"stats")?statsHtml(d):""}
  ${sec(d,"profil","Profil",profileHtml(d))}${sec(d,"experience","Expérience",expHtml(d))}${sec(d,"projets","Projets",projHtml(d))}${sec(d,"competences","Compétences",skillsHtml(d))}
  <div class="two-cols">${sec(d,"formation","Formation",formHtml(d))}${sec(d,"softskills","Savoir-être",softHtml(d))}</div></div>`;
}
function renderSidebar(d){
  const c = d.contact||{};
  const side = (key,label,body) => (body && show(d,key)) ? `<div class="side-block"><div class="side-label">${label}</div>${body}</div>` : "";
  const links = arr(d.links).map(l=>`<a href="${esc(l.url)}">${esc(l.label)}</a>`).join("");
  return `<aside class="sidebar">${avatarHtml(d)}
    ${side("contact","Contact",sideItems([["Localisation",c.location],["Téléphone",c.phone],["Email",c.email]]))}
    ${side("competences","Compétences",arr(d.skills).map(s=>`<div class="side-item"><strong>${esc(s.name)}</strong>${esc(s.value)}</div>`).join(""))}
    ${side("liens","Liens",links?`<div class="side-links">${links}</div>`:"")}
    ${side("formation","Formation",formHtml(d))}${side("softskills","Savoir-être",softHtml(d))}</aside>
    <main class="content">${headerHtml(d)}${show(d,"stats")?statsHtml(d):""}
    ${sec(d,"profil","Profil",profileHtml(d))}${sec(d,"experience","Expérience",expHtml(d))}${sec(d,"projets","Projets",projHtml(d))}</main>`;
}
function renderModern(d){
  const c = d.contact||{};
  const links = arr(d.links).length ? `<div class="links-col">${d.links.map(l=>`<a href="${esc(l.url)}">${esc(l.label)}</a>`).join("")}</div>` : "";
  return `<header class="m-head">${headerHtml(d)}${show(d,"stats")?statsHtml(d):""}</header>
    <main class="main">${sec(d,"profil","Profil",profileHtml(d))}${sec(d,"experience","Expérience",expHtml(d))}${sec(d,"projets","Projets",projHtml(d))}</main>
    <aside class="aside">${sec(d,"contact","Contact",sideItems([["Localisation",c.location],["Téléphone",c.phone],["Email",c.email]]))}${sec(d,"liens","Liens",links)}${sec(d,"competences","Compétences",skillsHtml(d))}${sec(d,"formation","Formation",formHtml(d))}${sec(d,"softskills","Savoir-être",softHtml(d))}</aside>`;
}
const RENDERERS = {pdf:renderSingle,bold:renderSingle,classic:renderSingle,minimal:renderSingle,sidebar:renderSidebar,modern:renderModern};

function renderCV(d){
  const t = themeOf(d);
  preview.className = "page t-" + t;
  preview.style.cssText = vars(d);
  return RENDERERS[t](d);
}
function buildStandaloneHtml(d, forPdf){
  const t = themeOf(d);
  return `<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>CV - ${esc(FIXED.fullName)}</title>
<link rel="icon" type="image/svg+xml" href="${faviconUrl(accentOf(d))}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700;900&family=Poppins:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;600;700;800&family=Merriweather:wght@400;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
${$("cv-styles").outerHTML}
${forPdf ? `<style>html,body{margin:0;background:#fff}.page{box-shadow:none}</style>` : `<style>@page{size:A4;margin:0}body{margin:0;background:#e9ecef;display:flex;justify-content:center}.page{box-shadow:none}@media print{body{background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>`}
</head><body><div class="page t-${t}" style="${vars(d)}">${RENDERERS[t](d)}</div></body></html>`;
}

/* ---------- UI ---------- */
const jsonInput=$("jsonInput"), preview=$("preview"), statusEl=$("status"), toastEl=$("toast"), pageBox=$("pageBox"), pageGuides=$("pageGuides"), pageInfo=$("pageInfo");
let toastTimer;
const setStatus=(t,e)=>{statusEl.textContent=t;statusEl.className=e?"error":"ok"};
const showToast=(m,ms)=>{clearTimeout(toastTimer);toastEl.textContent=m;toastEl.classList.add("show");toastTimer=setTimeout(()=>toastEl.classList.remove("show"),ms)};
const save=()=>{try{localStorage.setItem("cv-data",JSON.stringify(currentData))}catch(e){}};

const PAGE_W_PX=210*96/25.4, PAGE_H_PX=297*96/25.4;
const onePageOn=()=>currentData.onePage!==false;
function fitPage(el,enabled){
  el.style.transform="none"; el.style.width=PAGE_W_PX+"px"; el.style.minHeight=PAGE_H_PX+"px";
  let k=1;
  if(enabled && el.offsetHeight>PAGE_H_PX+1){
    let ok=false;
    for(let t=.98;t>=.70;t-=.02){
      el.style.width=(PAGE_W_PX/t)+"px"; el.style.minHeight=(PAGE_H_PX/t)+"px";
      if(el.offsetHeight<=PAGE_H_PX/t+1){k=t;ok=true;break}
    }
    if(!ok){k=.70;el.style.width=(PAGE_W_PX/k)+"px";el.style.minHeight=(PAGE_H_PX/k)+"px"}
  }
  return k;
}
function updatePreviewLayout(){
  const k=fitPage(preview,onePageOn()), h=preview.offsetHeight*k;
  preview.style.transform=k<1?`scale(${k})`:"none";
  pageBox.style.width=PAGE_W_PX+"px"; pageBox.style.height=h+"px"; pageGuides.style.height=h+"px";
  const pages=Math.max(1,Math.ceil((h-2)/PAGE_H_PX));
  pageInfo.textContent=pages+(pages===1?" page":" pages")+(k<1?" · "+Math.round(k*100)+"%":"");
  pageInfo.className=pages>1?"warn":"";
}

// Contrôles de style (couleurs, police, tailles)
const CTRL=[["cInk","ink"],["cText","text"],["cBand","band"],["cBg","bg"],["cFont","font"],["cSize","size"],["cSpace","space"],["cMargin","margin"]];
Object.keys(FONTS).forEach(f=>{const o=document.createElement("option");o.value=o.textContent=f;$("cFont").appendChild(o)});
CTRL.forEach(([id,k])=>$(id).addEventListener("input",e=>{ST()[k]=e.target.type==="range"?+e.target.value:e.target.value;refresh(true)}));
$("accentInput").addEventListener("input",e=>{currentData.accent=e.target.value;refresh(true)});
PALETTES.forEach(p=>{
  const b=document.createElement("button");b.className="pal";b.innerHTML=`<i style="background:${p.a}"></i>${p.n}`;
  b.onclick=()=>{currentData.accent=p.a;Object.assign(ST(),{ink:p.i,band:p.b});refresh(true)};
  $("palettes").appendChild(b);
});
Object.entries(SECTIONS).forEach(([k,l])=>{
  const lb=document.createElement("label");lb.innerHTML=`<input type="checkbox" data-sec="${k}"> ${l}`;
  lb.firstChild.addEventListener("change",e=>{
    const h=new Set(arr(currentData.hide)); e.target.checked?h.delete(k):h.add(k); currentData.hide=[...h]; refresh(true);
  });
  $("sectionChecks").appendChild(lb);
});
Object.entries(THEMES).forEach(([key,t])=>{
  const b=document.createElement("button");b.className="theme-btn";b.dataset.theme=key;b.textContent=t.label;
  b.onclick=()=>{currentData.theme=key;currentData.accent=t.accent;refresh(true);setStatus("✅ Design : "+t.label,false)};
  $("themePicker").appendChild(b);
});
Object.entries(PRESETS).forEach(([k,p])=>{const o=document.createElement("option");o.value=k;o.textContent=p.label;$("presetSel").appendChild(o)});
$("presetSel").onchange=e=>{currentPreset=e.target.value;currentData=clone(PRESETS[currentPreset].data);refresh(true);setStatus("✅ Modèle : "+PRESETS[currentPreset].label,false)};
$("btnReset").onclick=()=>{currentData=clone(PRESETS[currentPreset].data);refresh(true);setStatus("Modèle rechargé",false)};
$("onePage").addEventListener("change",e=>{currentData.onePage=e.target.checked;refresh(true)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(updatePreviewLayout);

function refresh(writeJson){
  preview.innerHTML=renderCV(currentData);
  updatePreviewLayout();
  $("onePage").checked=onePageOn();
  if(writeJson)jsonInput.value=JSON.stringify(currentData,null,2);
  const s=Object.assign({},STYLE_DEF,currentData.style||{});
  CTRL.forEach(([id,k])=>{$(id).value=s[k]});
  $("accentInput").value=accentOf(currentData);
  document.querySelectorAll("[data-sec]").forEach(c=>c.checked=show(currentData,c.dataset.sec));
  document.querySelectorAll(".theme-btn").forEach(b=>b.classList.toggle("active",b.dataset.theme===themeOf(currentData)));
  $("favicon").href=faviconUrl(accentOf(currentData));
  save();
}

let debounceTimer;
jsonInput.addEventListener("input",()=>{
  clearTimeout(debounceTimer);
  debounceTimer=setTimeout(()=>{
    try{currentData=JSON.parse(jsonInput.value);refresh(false);setStatus("✅ Mise à jour",false)}
    catch(e){setStatus("❌ Erreur JSON : "+e.message,true);showToast("❌ JSON invalide : "+e.message,3500)}
  },300);
});

$("btnCopy").onclick=async()=>{
  const html=buildStandaloneHtml(currentData);
  try{await navigator.clipboard.writeText(html);setStatus("✅ HTML copié",false)}
  catch(e){const ta=document.createElement("textarea");ta.value=html;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();setStatus("✅ HTML copié",false)}
};
$("btnDownload").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([buildStandaloneHtml(currentData)],{type:"text/html"}));
  a.download="cv-"+themeOf(currentData)+".html";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);setStatus("✅ HTML téléchargé",false);
};
$("btnPrint").onclick=()=>{setStatus("Choisis « Enregistrer au format PDF » dans la fenêtre d'impression",false);window.print()};

/* ---------- Export PDF réel (html2canvas + jsPDF) ---------- */
const MM=96/25.4;
function isBlankRow(ctx,w,row,bg){const d=ctx.getImageData(0,row,w,1).data;for(let i=0;i<d.length;i+=4){if(Math.abs(d[i]-bg[0])>6||Math.abs(d[i+1]-bg[1])>6||Math.abs(d[i+2]-bg[2])>6)return false}return true}
function findCut(ctx,w,y,end,back,bg){let run=0;for(let r=end-1;r>end-back&&r>y+60;r--){if(isBlankRow(ctx,w,r,bg)){run++;if(run>=4)return r+2}else run=0}return end}
function collectLayer(doc){
  const words=[],links=[],win=doc.defaultView,walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT),rng=doc.createRange();let n;
  while((n=walker.nextNode())){
    const t=n.nodeValue;if(!t.trim()||!n.parentElement)continue;
    const cs=win.getComputedStyle(n.parentElement);if(cs.visibility==="hidden"||cs.display==="none")continue;
    const re=/\S+/g;let m;
    while((m=re.exec(t))){
      rng.setStart(n,m.index);rng.setEnd(n,m.index+m[0].length);
      const b=rng.getClientRects()[0];if(!b||!b.width)continue;
      let s=m[0];if(cs.textTransform==="uppercase")s=s.toUpperCase();else if(cs.textTransform==="lowercase")s=s.toLowerCase();
      s=s.replace(/[^\u0020-\u00FF\u20AC\u2013\u2014\u2018\u2019\u201C\u201D\u2022]/g,"");if(!s)continue;
      words.push({s,x:b.left,top:b.top,bottom:b.bottom,w:b.width,fs:parseFloat(cs.fontSize)||12,bold:parseInt(cs.fontWeight,10)>=600});
    }
  }
  doc.querySelectorAll("a[href]").forEach(a=>{
    const href=a.getAttribute("href")||"";if(!/^(https?:|mailto:|tel:)/i.test(href))return;
    Array.from(a.getClientRects()).forEach(b=>{if(b.width>1&&b.height>1)links.push({url:href,x:b.left,top:b.top,w:b.width,h:b.height})});
  });
  return {words,links};
}
function addLayer(pdf,layer,k,y0,y1){
  const PT=72/25.4;
  layer.words.forEach(w=>{
    const mid=(w.top+w.bottom)/2;if(mid<y0||mid>=y1)return;
    pdf.setFont("helvetica",w.bold?"bold":"normal");pdf.setFontSize(w.fs*k*PT);
    const tw=pdf.getTextWidth(w.s),cs=w.s.length>1?(w.w*k-tw)/(w.s.length-1):0;
    pdf.text(w.s+" ",w.x*k,(w.bottom-y0)*k,{baseline:"bottom",renderingMode:"invisible",charSpace:cs});
  });
  layer.links.forEach(l=>{const mid=l.top+l.h/2;if(mid<y0||mid>=y1)return;pdf.link(l.x*k,(l.top-y0)*k,l.w*k,l.h*k,{url:l.url})});
}
async function exportPdf(){
  const btn=$("btnPdf");btn.disabled=true;setStatus("Création du PDF…",false);let holder=null;
  try{
    if(!window.html2canvas||!window.jspdf)throw new Error("Librairies PDF non chargées : vérifie ta connexion et recharge la page.");
    const PW=210,PH=297,W=Math.ceil(PW*MM);
    holder=document.createElement("iframe");
    holder.setAttribute("sandbox","allow-same-origin");holder.setAttribute("aria-hidden","true");
    holder.style.cssText=`position:fixed;left:-20000px;top:0;border:0;width:${W}px;height:10px`;
    await new Promise((res,rej)=>{holder.onload=res;holder.onerror=rej;holder.srcdoc=buildStandaloneHtml(currentData,true);document.body.appendChild(holder)});
    const doc=holder.contentDocument;
    if(doc.fonts&&doc.fonts.ready)await doc.fonts.ready;
    await Promise.all(Array.from(doc.images).map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));
    const k=fitPage(doc.querySelector(".page"),onePageOn()),Wn=Math.ceil(PAGE_W_PX/k);
    holder.style.width=Wn+"px";holder.style.height="10px";
    const H=Math.max(Math.ceil(doc.documentElement.scrollHeight),20);holder.style.height=H+"px";
    const layer=collectLayer(doc),scale=Math.max(1,Math.min(2,30000/H));
    const canvas=await window.html2canvas(doc.documentElement,{scale,backgroundColor:"#ffffff",width:Wn,height:H,windowWidth:Wn,windowHeight:H,useCORS:true,logging:false});
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:[PW,PH],orientation:"portrait",compress:true});
    const cw=canvas.width,chh=canvas.height,pagePx=Math.floor(cw*PH/PW),mmPerPx=PW/Wn;
    const ctx=canvas.getContext("2d",{willReadFrequently:true}),bg=ctx.getImageData(0,0,1,1).data;
    let y=0,first=true,pages=0;
    while(y<chh-1){
      let end=Math.min(chh,y+pagePx);
      if(chh-y-pagePx<4*scale)end=chh;else if(end<chh)end=findCut(ctx,cw,y,end,Math.floor(pagePx*.18),bg);
      const sh=end-y,part=document.createElement("canvas");part.width=cw;part.height=sh;
      const pc=part.getContext("2d");pc.fillStyle="#ffffff";pc.fillRect(0,0,cw,sh);pc.drawImage(canvas,0,y,cw,sh,0,0,cw,sh);
      if(!first)pdf.addPage([PW,PH],"portrait");first=false;
      pdf.addImage(part.toDataURL("image/jpeg",.95),"JPEG",0,0,PW,sh*PW/cw,undefined,"FAST");
      addLayer(pdf,layer,mmPerPx,y/scale,end/scale);pages++;y=end;
    }
    const name="CV-"+FIXED.fullName.replace(/\s+/g,"-")+".pdf",a=document.createElement("a");
    a.href=URL.createObjectURL(pdf.output("blob"));a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    setStatus(`✅ PDF prêt : ${name} (${pages} page${pages>1?"s":""})`,false);
  }catch(err){
    const m=err&&err.message?err.message:"Impossible de créer le PDF";setStatus("❌ "+m,true);showToast("❌ "+m,4000);
  }finally{if(holder&&holder.parentNode)holder.parentNode.removeChild(holder);btn.disabled=false}
}
$("btnPdf").onclick=exportPdf;

// Chargement initial (reprend la dernière sauvegarde)
try{const saved=localStorage.getItem("cv-data");if(saved){const p=JSON.parse(saved);if(p&&Array.isArray(p.experience))currentData=p}}catch(e){}
refresh(true);
</script>
