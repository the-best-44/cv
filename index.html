<style id="cv-styles">
*{box-sizing:border-box;margin:0;padding:0}
.page{font-family:var(--font);font-size:calc(var(--fs)*1px);line-height:1.5;width:210mm;min-height:297mm;background:var(--bg);color:var(--soft);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.page a{color:inherit;text-decoration:none}.page ul{list-style:none}
.page h1{font-size:2.4em;font-weight:800;color:var(--ink);line-height:1.1;letter-spacing:-.01em}
.role{margin-top:.35em;font-size:1em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.contact-line{margin-top:.5em}.availability{margin-top:.3em;font-style:italic}
.links-line{display:flex;flex-wrap:wrap;gap:.2em 1.2em;margin-top:.25em;color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;margin-top:1em;padding:.6em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat{flex:1;min-width:8em;padding:0 1em;border-left:1px solid var(--rule)}
.stat:first-child{padding-left:0;border-left:0}
.stat-value{font-size:1.5em;font-weight:800;color:var(--accent);line-height:1.1}
.stat-label{font-size:.88em;margin-top:.15em;line-height:1.3}
.section{margin-top:calc(1.25em*var(--sp))}
.section-title{font-size:.95em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding-bottom:.35em;margin-bottom:.7em;border-bottom:1px solid var(--accent)}
.profil-text{text-align:left}
.entry{margin-bottom:calc(.85em*var(--sp))}
.entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:1em}
.entry-title{font-size:1.06em;font-weight:700;color:var(--ink)}
.entry-date{font-size:.92em;font-weight:600;color:var(--accent);white-space:nowrap}
.entry-org{font-style:italic}
.entry-tags{margin-top:.35em;font-size:.9em;color:var(--soft)}
.entry-link{margin-top:.3em}
.bullets{margin-top:.3em}.bullets li{position:relative;padding-left:1em;margin-bottom:.15em}
.bullets li:before{content:'';position:absolute;left:0;top:.62em;width:.3em;height:.3em;background:var(--accent)}
.bullets li strong{color:var(--ink)}
.page .proj-link{color:var(--accent);font-weight:600;white-space:nowrap;border-bottom:1px solid var(--rule)}
.skill{margin-bottom:.3em}
.skill-name,.formation-title{font-weight:700;color:var(--ink)}
.formation-year{font-weight:700;color:var(--accent);font-size:.9em}.formation-entry{margin-bottom:.45em}
.plain-line{color:var(--soft)}
.single{padding:var(--pad)}
.head{display:flex;justify-content:space-between;gap:var(--avg,1em);align-items:center}
.avatar{--b:7em;width:calc(var(--b)*var(--avk,1));height:calc(var(--b)*var(--avk,1));border-radius:50%;overflow:hidden;border:2px solid var(--accent);flex:none}
.avatar.sq{border-radius:8px}
.avatar img{width:100%;height:100%;object-fit:cover}

.t-pdf .head{border-bottom:2px solid var(--accent);padding-bottom:.8em}
.t-minimal .head{flex-direction:column;text-align:center}
.t-minimal h1{font-family:'Playfair Display',serif;font-weight:600;font-size:2.7em}
.t-minimal .role{color:var(--soft);letter-spacing:.22em}.t-minimal .links-line{justify-content:center}
.t-minimal .stats{justify-content:center}
.t-minimal .avatar{order:-1;margin-bottom:.7em}
.t-minimal .stat{text-align:center;flex:none}
.t-minimal .stat-value{color:var(--ink)}
.t-minimal .section-title{color:var(--ink);border-bottom:1px solid var(--ink)}
.t-minimal .bullets li:before{background:var(--ink)}
.t-bold .avatar{border-color:var(--accent-light)}
.t-bold .head{background:var(--band);color:var(--band-text);margin:calc(-1*var(--pad)) calc(-1*var(--pad)) 0;padding:var(--pad)}
.t-bold h1{color:var(--band-text)}.t-bold .role,.t-bold .links-line{color:var(--accent-light)}
.t-bold .section-title{border:0;border-left:4px solid var(--accent);padding:.1em 0 .1em .6em;margin-bottom:.7em}
.t-classic h1{font-family:'Merriweather',serif;font-weight:700;font-size:2.1em;letter-spacing:0}
.t-classic .head{border-bottom:3px double var(--ink);padding-bottom:.8em}
.t-classic .role{letter-spacing:.04em;text-transform:none;color:var(--ink);font-weight:600}
.t-classic .stat-value{color:var(--ink);font-size:1.35em}
.t-classic .section-title{color:var(--ink);border-bottom:1px solid var(--ink)}
.t-classic .bullets li:before{background:var(--ink)}
.t-sidebar{display:grid;grid-template-columns:37% 1fr;background:var(--bg)}
.t-sidebar .main-col{grid-column:2;grid-row:1;padding:calc(var(--pad)*.9) var(--pad) calc(var(--pad)*1.1) calc(var(--pad)*.85);min-width:0}
.t-sidebar .sidebar{grid-column:1;grid-row:1;background:var(--band);color:var(--band-text);padding:calc(var(--pad)*.9) calc(var(--pad)*.6)}
.t-sidebar .head{display:block}
.t-sidebar h1{font-family:'Playfair Display',serif;font-weight:700;font-size:2.4em;letter-spacing:0}
.t-sidebar .role{letter-spacing:.14em;font-size:.88em}
.t-sidebar .availability{font-style:normal;font-size:.95em;margin-top:.35em}
.t-sidebar .head-rule{width:4.5em;height:2px;background:var(--accent);margin-top:1em}
.t-sidebar .stats{border-top:0;padding-top:.2em}
.t-sidebar .main-col{counter-reset:sec}
.t-sidebar .main-col .section{counter-increment:sec;margin-top:calc(1.5em*var(--sp))}
.t-sidebar .main-col .section-title{display:flex;align-items:baseline;border:0;padding:0;color:var(--ink);letter-spacing:.16em}
.t-sidebar .main-col .section-title:before{content:counter(sec,decimal-leading-zero);font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:1.55em;letter-spacing:0;color:var(--accent);margin-right:.55em}
.t-sidebar .profil-text{color:var(--soft)}
.t-sidebar .entry{position:relative;padding-left:1.5em;margin-bottom:calc(1.1em*var(--sp))}
.t-sidebar .entry:before{content:'';position:absolute;left:calc(.35em - 1px);top:.5em;bottom:calc(-1.1em*var(--sp));width:2px;background:var(--rule)}
.t-sidebar .entry:last-child:before{bottom:0}
.t-sidebar .entry:after{content:'';position:absolute;left:0;top:.15em;width:.7em;height:.7em;border:2px solid var(--accent);border-radius:50%;background:var(--bg)}
.t-sidebar .entry-head{display:flex;flex-direction:column-reverse;align-items:flex-start;gap:0}
.t-sidebar .entry-date{font-size:.8em;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.t-sidebar .bullets li:before{border-radius:50%;width:.26em;height:.26em;background:var(--soft)}
.t-sidebar .sidebar .avatar{margin:0 auto 1.8em;--b:8.5em;border-color:var(--accent-light)}
.side-block{margin-bottom:1.7em}
.side-label{font-size:.8em;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:.8em}
.side-item{margin-bottom:.7em;word-break:break-word}.side-item strong{display:block;color:var(--band-text)}
.side-item.skill-inline strong{display:inline}
.side-links{display:flex;flex-direction:column;gap:.55em;word-break:break-all;font-size:1.05em}
.side-list li{margin-bottom:.2em}
.t-sidebar .formation-entry{border-left:3px solid var(--accent);padding-left:.8em;margin-bottom:.8em}
.t-sidebar .formation-title{color:var(--band-text)}.t-sidebar .formation-year{color:var(--accent)}.t-sidebar .formation-school{opacity:.8}
.t-modern{display:grid;grid-template-columns:1fr 32%;grid-template-rows:auto 1fr}
.t-modern .m-head{grid-column:1/-1;background:var(--band);color:var(--band-text);padding:var(--pad) var(--pad) calc(var(--pad)*.7)}
.t-modern .m-top{display:flex;justify-content:space-between;align-items:center;gap:var(--avg,1em)}.t-modern .avatar{border-color:var(--accent-light)}
.t-modern .m-head h1{color:var(--band-text)}.t-modern .m-head .role{color:var(--accent-light)}
.t-modern .m-head .stats{border-color:rgba(255,255,255,.3)}.t-modern .m-head .stat{border-color:rgba(255,255,255,.3)}
.t-modern .m-head .stat-value{color:var(--accent-light)}
.t-modern .main{padding:calc(var(--pad)*.6) calc(var(--pad)*.6) var(--pad) var(--pad)}
.t-modern .aside{background:var(--tint);padding:calc(var(--pad)*.6) var(--pad) var(--pad) calc(var(--pad)*.6)}
.t-modern .section-title{border-bottom:1px solid var(--rule)}
.t-modern .links-col{display:flex;flex-direction:column;gap:.3em;color:var(--accent);word-break:break-all}
.t-modern .side-item strong{font-size:.9em;text-transform:uppercase;letter-spacing:.08em;color:var(--ink)}
.t-modern .side-list li{margin-bottom:.2em}
.page:not(.t-minimal):not(.t-sidebar) .head>div:first-child,.t-modern .m-top>div:first-child{flex:1;min-width:0}
.page:not(.t-minimal) .head .avatar,.t-modern .m-top .avatar{margin-right:var(--ave,0mm)}
.av-left:not(.t-minimal) .head .avatar,.t-modern.av-left .m-top .avatar{order:-1;margin-right:0;margin-left:var(--ave,0mm)}
.t-sidebar.av-left .sidebar .avatar{margin-left:0;margin-right:auto}
.t-sidebar.av-right .sidebar .avatar{margin-left:auto;margin-right:0}
/* Lettre de motivation */
.letter{padding:var(--pad);min-height:297mm}
.lt-head{display:flex;justify-content:space-between;align-items:center;gap:var(--avg,1em);padding-bottom:.8em;border-bottom:2px solid var(--accent)}
.lt-head>div:first-child{flex:1;min-width:0}
.av-left .lt-head .avatar{order:-1}
.lt-from{line-height:1.5}.lt-from div{margin-top:.1em}.lt-from h1{margin-bottom:.25em}
.lt-meta{margin-top:2.2em}
.lt-rec{margin-left:auto;width:48%;line-height:1.45;color:var(--ink);font-weight:600}
.lt-date{margin-top:1.4em;text-align:right}
.lt-subj{margin-top:1.8em;color:var(--ink)}
.lt-body{margin-top:1.6em}.lt-body p{margin-bottom:1em;text-align:justify;line-height:1.6}
.lt-sign{margin-top:2.2em;font-weight:700;color:var(--ink)}
.lt-bold .lt-head,.lt-modern .lt-head,.lt-sidebar .lt-head{background:var(--band);color:var(--band-text);margin:calc(-1*var(--pad)) calc(-1*var(--pad)) 0;padding:var(--pad);border:0}
.lt-bold h1,.lt-modern h1,.lt-sidebar h1{color:var(--band-text)}
.lt-bold .role,.lt-modern .role,.lt-sidebar .role,.lt-bold .links-line,.lt-modern .links-line,.lt-sidebar .links-line{color:var(--accent-light)}
.lt-bold .avatar,.lt-modern .avatar,.lt-sidebar .avatar{border-color:var(--accent-light)}
.lt-minimal .lt-head{flex-direction:column;text-align:center}
.lt-minimal h1{font-family:'Playfair Display',serif;font-weight:600;font-size:2.7em}
.lt-minimal .role{color:var(--soft);letter-spacing:.22em}.lt-minimal .links-line{justify-content:center}
.lt-minimal .avatar{order:-1;margin-bottom:.7em}
.lt-classic h1{font-family:'Merriweather',serif;font-weight:700;font-size:2.1em;letter-spacing:0}
.lt-classic .lt-head{border-bottom:3px double var(--ink)}
.lt-classic .role{letter-spacing:.04em;text-transform:none;color:var(--ink);font-weight:600}
@media print{.page{box-shadow:none}}
</style>

<style>

/* Annulla / Ripristina + salvataggio automatico */
let hist=[], hi=-1, histLock=false, histTimer;
const updUndo=()=>{$("btnUndo").disabled=hi<=0;$("btnRedo").disabled=hi>=hist.length-1};
function persist(){ try{ localStorage.setItem("cv-autosave",JSON.stringify({d:currentData,p:currentPreset})); }catch(e){} }
function histPush(){
  if(histLock)return;
  const s=JSON.stringify(currentData); if(hist[hi]===s)return;
  hist=hist.slice(0,hi+1); hist.push(s); if(hist.length>100)hist.shift(); hi=hist.length-1;
  updUndo(); persist();
}
const histSched=()=>{clearTimeout(histTimer);histTimer=setTimeout(histPush,500)};
function histGo(n){
  clearTimeout(histTimer); histPush();
  const j=hi+n; if(j<0||j>=hist.length)return;
  hi=j; currentData=JSON.parse(hist[hi]); jsonErr=null; renderErr();
  dirtyPaths.clear();
  histLock=true; buildForm(); refresh(true); histLock=false; updUndo(); persist();
}

const PAGE_W_PX=210*96/25.4, PAGE_H_PX=297*96/25.4;
const onePageOn=()=>docMode==="cv"&&currentData.onePage!==false;
function fitPage(el,enabled){
  el.style.transform="none"; el.style.width=PAGE_W_PX+"px"; el.style.minHeight=PAGE_H_PX+"px";
  let k=1;
  if(enabled && el.offsetHeight>PAGE_H_PX+1){
    let ok=false;
    for(let s=.98;s>=.70;s-=.02){
      el.style.width=(PAGE_W_PX/s)+"px"; el.style.minHeight=(PAGE_H_PX/s)+"px";
      if(el.offsetHeight<=PAGE_H_PX/s+1){k=s;ok=true;break}
    }
    if(!ok){k=.70;el.style.width=(PAGE_W_PX/k)+"px";el.style.minHeight=(PAGE_H_PX/k)+"px"}
  }
  return k;
}
function updatePreviewLayout(){
  const k=fitPage(preview,onePageOn()), h=preview.offsetHeight*k;
  preview.style.transform=k<1?`scale(${k})`:"none";
  pageBox.style.width=PAGE_W_PX+"px"; pageBox.style.height=h+"px"; pageGuides.style.height=h+"px";
  const avail=pageBox.parentElement.clientWidth-(innerWidth<=960?24:40), m=(avail>100&&avail<PAGE_W_PX)?avail/PAGE_W_PX:1;
  pageBox.style.transformOrigin="0 0"; pageBox.style.transform=m<1?`scale(${m})`:"none";
  pageBox.style.marginRight=m<1?`${-PAGE_W_PX*(1-m)}px`:"0"; pageBox.style.marginBottom=m<1?`${-h*(1-m)}px`:"0";
  const pages=Math.max(1,Math.ceil((h-2)/PAGE_H_PX));
  pageInfo.textContent=pages+" "+t(pages>1?"pageMany":"pageOne")+(k<1?" · "+Math.round(k*100)+"%":"");
  pageInfo.className=pages>1?"warn":"";
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("savedModal").hidden){$("savedModal").hidden=true;return}
  if(!(e.ctrlKey||e.metaKey))return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||""))return;
  const k=e.key.toLowerCase();
  if(k==="z"){e.preventDefault();histGo(e.shiftKey?1:-1)}
  else if(k==="y"){e.preventDefault();histGo(1)}
});

const jsonHl=$("jsonHl");
const e2=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const jsonRe=/("(?:\\.|[^"\\])*")(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
function hlLine(text){
  jsonRe.lastIndex=0;
  let out="",last=0,m;
  while((m=jsonRe.exec(text))){
    out+=e2(text.slice(last,m.index));
    if(m[1]!==undefined)out+=`<span class="${m[2]?"jk":"js"}">${e2(m[1])}</span>`+(m[2]?e2(m[2]):"");
    else out+=`<span class="${/^-?\d/.test(m[0])?"jn":"jb"}">${m[0]}</span>`;
    last=jsonRe.lastIndex;
  }
  return out+e2(text.slice(last));
}
function hlJson(text){
  const rows=text.split("\n").map((ln,i)=>{
    const h=hlLine(ln)||" ";
    return (jsonErr&&jsonErr.line===i+1)?`<span class="jl-err">${h}</span>`:h;
  });
  return rows.join("\n")+"\n ";
}
function syncHl(){jsonHl.scrollTop=jsonInput.scrollTop;jsonHl.scrollLeft=jsonInput.scrollLeft}
function hlUpdate(){jsonHl.innerHTML=hlJson(jsonInput.value);syncHl()}
function setJson(v){jsonInput.value=v;hlUpdate()}
jsonInput.addEventListener("scroll",syncHl);

const indexOfLC=(text,l,c)=>{const ls=text.split("\n");let i=0;for(let k=0;k<l-1&&k<ls.length;k++)i+=ls[k].length+1;return i+c-1};
const lcOfIndex=(text,i)=>{const b=text.slice(0,i).split("\n");return [b.length,b[b.length-1].length+1]};
function parseJsonError(text,err){
  const message=String(err&&err.message||err);
  const lc=message.match(/line (\d+) column (\d+)/), pm=message.match(/position (\d+)/);
  let idx=pm?+pm[1]:lc?indexOfLC(text,+lc[1],+lc[2]):-1, trailing=false;
  if(idx>=0&&/[}\]]/.test(text[idx]||"")){
    let j=idx-1;while(j>=0&&/\s/.test(text[j]))j--;
    if(j>=0&&text[j]===","){idx=j;trailing=true}
  }
  const [line,col]=idx>=0?lcOfIndex(text,idx):[0,0];
  return {message,line,col,trailing};
}
function renderErr(){
  document.querySelectorAll(".jerr-banner").forEach(b=>{
    b.hidden=!jsonErr;
    if(!jsonErr)return;
    const where=jsonErr.line?t("jerr.line",{l:jsonErr.line,c:jsonErr.col}):"";
    b.innerHTML=`<div class="jerr-top"><strong>${esc(t("jerr.title"))}</strong>${where?`<span>${esc(where)}</span>`:""}</div><div class="jerr-msg">${esc(jsonErr.message)}</div>${jsonErr.trailing?`<div class="jerr-cause">${esc(t("jerr.trailing"))}</div>`:""}<div class="jerr-actions"><button type="button" data-goto="err">${esc(t("jerr.go"))}</button></div><div class="jerr-hint">${esc(t("jerr.hint"))}</div>`;
  });
  document.body.classList.toggle("has-jerr",!!jsonErr);
}

let debounceTimer;
jsonInput.addEventListener("input",()=>{
  jsonErr=null;hlUpdate();
  clearTimeout(debounceTimer);

const MM=96/25.4;
function isBlankRow(ctx,w,row,bg){const d=ctx.getImageData(0,row,w,1).data;for(let i=0;i<d.length;i+=4){if(Math.abs(d[i]-bg[0])>6||Math.abs(d[i+1]-bg[1])>6||Math.abs(d[i+2]-bg[2])>6)return false}return true}
function findCut(ctx,w,y,end,back,bg){let run=0;for(let r=end-1;r>end-back&&r>y+60;r--){if(isBlankRow(ctx,w,r,bg)){run++;if(run>=4)return r+2}else run=0}return end}
function collectLayer(doc){
  const words=[],links=[],win=doc.defaultView,walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT),rng=doc.createRange();let n;
  while((n=walker.nextNode())){
    const tx=n.nodeValue;if(!tx.trim()||!n.parentElement)continue;
    const cs=win.getComputedStyle(n.parentElement);if(cs.visibility==="hidden"||cs.display==="none")continue;
    const re=/\S+/g;let m;
    while((m=re.exec(tx))){
      rng.setStart(n,m.index);rng.setEnd(n,m.index+m[0].length);
      const b=rng.getClientRects()[0];if(!b||!b.width)continue;
      let s=m[0];if(cs.textTransform==="uppercase")s=s.toUpperCase();else if(cs.textTransform==="lowercase")s=s.toLowerCase();
      s=s.replace(/[^\u0020-\u00FF\u20AC\u2013\u2014\u2018\u2019\u201C\u201D\u2022]/g,"");if(!s)continue;
      words.push({s,x:b.left,top:b.top,bottom:b.bottom,w:b.width,fs:parseFloat(cs.fontSize)||12,bold:parseInt(cs.fontWeight,10)>=600});
    }
  }
  doc.querySelectorAll("a[href]").forEach(a=>{
    const href=a.getAttribute("href")||"";if(!/^(https?:|mailto:|tel:)/i.test(href))return;
    Array.from(a.getClientRects()).forEach(b=>{if(b.width>1&&b.height>1)links.push({url:href,x:b.left,top:b.top,w:b.width,h:b.height})});
  });
  return {words,links};
}
function addLayer(pdf,layer,k,y0,y1){
  const PT=72/25.4;
  layer.words.forEach(w=>{
    const mid=(w.top+w.bottom)/2;if(mid<y0||mid>=y1)return;
    pdf.setFont("helvetica",w.bold?"bold":"normal");pdf.setFontSize(w.fs*k*PT);
    const tw=pdf.getTextWidth(w.s),cs=w.s.length>1?(w.w*k-tw)/(w.s.length-1):0;
    pdf.text(w.s+" ",w.x*k,(w.bottom-y0)*k,{baseline:"bottom",renderingMode:"invisible",charSpace:cs});
  });
  layer.links.forEach(l=>{const mid=l.top+l.h/2;if(mid<y0||mid>=y1)return;pdf.link(l.x*k,(l.top-y0)*k,l.w*k,l.h*k,{url:l.url})});
}
async function exportPdf(){
  const btn=$("btnPdf");btn.disabled=true;setStatus(t("st.pdfBuilding"),false);let holder=null;
  try{
    if(!window.html2canvas||!window.jspdf)throw new Error(t("st.pdfLibs"));
    const PW=210,PH=297,W=Math.ceil(PW*MM);
    holder=document.createElement("iframe");
    holder.setAttribute("sandbox","allow-same-origin");holder.setAttribute("aria-hidden","true");
    holder.style.cssText=`position:fixed;left:-20000px;top:0;border:0;width:${W}px;height:10px`;
    await new Promise((res,rej)=>{holder.onload=res;holder.onerror=rej;holder.srcdoc=buildStandaloneHtml(currentData,true);document.body.appendChild(holder)});
    const doc=holder.contentDocument;
    if(doc.fonts&&doc.fonts.ready)await doc.fonts.ready;
    await Promise.all(Array.from(doc.images).map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));
    const k=fitPage(doc.querySelector(".page"),onePageOn()),Wn=Math.ceil(PAGE_W_PX/k);
    holder.style.width=Wn+"px";holder.style.height="10px";
    const H=Math.max(Math.ceil(doc.documentElement.scrollHeight),20);holder.style.height=H+"px";
    const layer=collectLayer(doc),scale=Math.max(1,Math.min(2,30000/H));
    const canvas=await window.html2canvas(doc.documentElement,{scale,backgroundColor:"#ffffff",width:Wn,height:H,windowWidth:Wn,windowHeight:H,useCORS:true,logging:false});
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:[PW,PH],orientation:"portrait",compress:true});
    const cw=canvas.width,chh=canvas.height,pagePx=Math.floor(cw*PH/PW),mmPerPx=PW/Wn;
    const ctx=canvas.getContext("2d",{willReadFrequently:true}),bg=ctx.getImageData(0,0,1,1).data;
    let y=0,first=true,pages=0;
    while(y<chh-1){
      let end=Math.min(chh,y+pagePx);
      if(chh-y-pagePx<4*scale)end=chh;else if(end<chh)end=findCut(ctx,cw,y,end,Math.floor(pagePx*.18),bg);
      const sh=end-y,part=document.createElement("canvas");
      part.width=cw;part.height=sh;
      const pc=part.getContext("2d");pc.fillStyle="#ffffff";pc.fillRect(0,0,cw,sh);pc.drawImage(canvas,0,y,cw,sh,0,0,cw,sh);
      if(!first)pdf.addPage([PW,PH],"portrait");first=false;
      pdf.addImage(part.toDataURL("image/jpeg",.95),"JPEG",0,0,PW,sh*PW/cw,undefined,"FAST");
      addLayer(pdf,layer,mmPerPx,y/scale,end/scale);pages++;y=end;
    }
    const name=(docMode==="letter"?"Lettre-":"CV-")+FIXED.fullName.replace(/\s+/g,"-")+".pdf",a=document.createElement("a");
    a.href=URL.createObjectURL(pdf.output("blob"));a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    setStatus(t("st.pdfReady",{n:name,p:pages+" "+t(pages>1?"pageMany":"pageOne")}),false);
  }catch(err){
    const m=err&&err.message?err.message:t("st.pdfFail");setStatus("❌ "+m,true);showToast("❌ "+m,4000);
  }finally{if(holder&&holder.parentNode)holder.parentNode.removeChild(holder);btn.disabled=false}
}
$("btnPdf").onclick=exportPdf;

const getP=(o,p)=>p.split(".").reduce((a,k)=>a==null?undefined:a[k],o);

function fIn(label,path,kind,rows){

function buildForm(){
  const sc=formEl.scrollTop;
  if(docMode==="letter"){formEl.innerHTML=buildLetterForm();formEl.scrollTop=sc;updateFoldLabels();return}
  const extraContact=Object.keys(contactObj(currentData)).filter(k=>!BASE_CONTACT.includes(k));
  const ord=orderKeys(currentData,DEFAULT_ORDER);
  const orderBody=`<p class="hint">${esc(t("f.orderHint"))}</p><div id="ordList">`+ord.map(k=>`<div class="fe-ord" data-k="${k}"><span class="fe-grip">⠿</span><span>${esc(t("sec."+k))}</span></div>`).join("")+`</div>`;
  formEl.innerHTML=[
    fSec("identity",fIn(t("f.role"),"role","text")+fIn(t("f.availability"),"availability","text")),
    fSec("order",orderBody),
    fSec("contact",BASE_CONTACT.map(k=>fIn(contactName(k,uiLang),"contact."+k,"text")).join("")
      +extraContact.map(k=>`<div class="fe-extra">${fIn(contactName(k,uiLang),"contact."+k,"text")}<button type="button" class="fe-del" data-act="delc" data-k="${esc(k)}">${esc(t("del"))}</button></div>`).join("")
      +`<div class="fe-extra"><input type="text" id="newContactKey" placeholder="${esc(t("f.newContact"))}" autocomplete="off"><button type="button" class="fe-add" data-act="addc">${esc(t("f.add"))}</button></div>`),
    fSec("profile",fIn(t("f.profileText"),"profile","area",7)),
    fSec("stats",fList("stats",i=>fTwo(fIn(t("f.value"),`stats.${i}.value`,"text"),fIn(t("f.caption"),`stats.${i}.label`,"text")))),
    fSec("experience",fList("experience",i=>fTwo(fIn(t("f.date"),`experience.${i}.date`,"text"),fIn(t("f.jobTitle"),`experience.${i}.title`,"text"))+fIn(t("f.org"),`experience.${i}.org`,"text")+fIn(t("f.missions"),`experience.${i}.bullets`,"lines",5)+fIn(t("f.tech"),`experience.${i}.tags`,"csv"))),
    fSec("projects",fList("projects",i=>fTwo(fIn(t("f.projName"),`projects.${i}.name`,"text"),fIn(t("f.date"),`projects.${i}.date`,"text"))+fIn(t("f.projPoints"),`projects.${i}.bullets`,"lines",4)+fIn(t("f.tech"),`projects.${i}.tags`,"csv")+fIn(t("f.projUrl"),`projects.${i}.url`,"text")+fIn(t("f.projLinkLabel"),`projects.${i}.linkLabel`,"text"))),
    fSec("skills",fList("skills",i=>fIn(t("f.skillCat"),`skills.${i}.name`,"text")+fIn(t("f.detail"),`skills.${i}.value`,"area",2))),
    fSec("formation",fList("formation",i=>fTwo(fIn(t("f.year"),`formation.${i}.year`,"text"),fIn(t("f.degree"),`formation.${i}.title`,"text"))+fIn(t("f.school"),`formation.${i}.school`,"text"))),
    fSec("soft",fList("softSkills",i=>fIn(t("f.quality"),`softSkills.${i}`,"text"))),
    fSec("languages",fList("languages",i=>fTwo(fIn(t("f.language"),`languages.${i}.name`,"text"),fIn(t("f.level"),`languages.${i}.level`,"text")))),
    fSec("certifications",fList("certifications",i=>fTwo(fIn(t("f.year"),`certifications.${i}.year`,"text"),fIn(t("f.certTitle"),`certifications.${i}.title`,"text"))+fIn(t("f.issuer"),`certifications.${i}.issuer`,"text"))),
    fSec("interests",fList("interests",i=>fIn(t("f.interest"),`interests.${i}`,"text"))),
    fSec("extra",fList("extra",i=>fIn(t("f.extraItem"),`extra.${i}`,"text"))),
    fSec("links",fList("links",i=>fTwo(fIn(t("f.linkName"),`links.${i}.label`,"text"),fIn(t("f.linkUrl"),`links.${i}.url`,"text"))))
  ].join("");
  formEl.scrollTop=sc;
  updateFoldLabels();
}
formEl.addEventListener("input",e=>{
  const el=e.target,p=el.dataset&&el.dataset.p; if(!p)return;
  let v=el.value;
  if(el.dataset.k==="lines")v=v.split("\n").map(s=>s.trim()).filter(Boolean);
  else if(el.dataset.k==="csv")v=v.split(",").map(s=>s.trim()).filter(Boolean);
  setP(currentData,p,v);
  dirtyPaths.add(p);
  const okb=el.closest(".fe-in")&&el.closest(".fe-in").querySelector(".fe-ok");if(okb)okb.classList.add("dirty");
  refresh(true);
});
formEl.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.target.tagName!=="INPUT"||!e.target.dataset.p)return;
  const w=e.target.closest(".fe-in"); if(!w)return;
  e.preventDefault(); const b=w.querySelector(".fe-ok"); if(b)b.click();
});
function dropHide(prefix,i){
  currentData.hide=arr(currentData.hide).filter(h=>h!==prefix+i).map(h=>{
    if(h.startsWith(prefix)){const n=+h.slice(prefix.length);if(isFinite(n)&&n>i)return prefix+(n-1)}
    return h;
  });
}
function swapHide(prefix,i,j){
  currentData.hide=arr(currentData.hide).map(h=>h===prefix+i?prefix+j:h===prefix+j?prefix+i:h);
}

/* Ordre des sections : trascinamento con mouse / dito */
let ordDrag=null;
formEl.addEventListener("pointerdown",e=>{
  const g=e.target.closest&&e.target.closest(".fe-grip"); if(!g)return;
  const row=g.closest(".fe-ord"); if(!row)return;
  e.preventDefault();
  ordDrag={row,list:row.parentElement,id:e.pointerId};
  row.classList.add("drag");
  try{formEl.setPointerCapture(e.pointerId)}catch(_){}
});
formEl.addEventListener("pointermove",e=>{
  if(!ordDrag||e.pointerId!==ordDrag.id)return;
  const {row,list}=ordDrag;
  const after=[...list.children].filter(x=>x!==row).find(s=>{const r=s.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  if(after){ if(row.nextElementSibling!==after)list.insertBefore(row,after); }
  else if(list.lastElementChild!==row)list.appendChild(row);
  const fr=formEl.getBoundingClientRect();
  if(e.clientY<fr.top+30)formEl.scrollTop-=10; else if(e.clientY>fr.bottom-30)formEl.scrollTop+=10;
});
function endOrdDrag(e){
  if(!ordDrag||(e&&e.pointerId!==ordDrag.id))return;
  const {row,list,id}=ordDrag; ordDrag=null;
  row.classList.remove("drag");
  try{formEl.releasePointerCapture(id)}catch(_){}
  currentData.order=[...list.children].map(x=>x.dataset.k);
  refresh(true);
}
formEl.addEventListener("pointerup",endOrdDrag);
formEl.addEventListener("pointercancel",endOrdDrag);

formEl.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b)return;
  if(b.dataset.act==="ok"){
    histPush();persist();
    const inp=b.closest(".fe-in").querySelector("[data-p]");
    if(inp)dirtyPaths.delete(inp.dataset.p);
    b.classList.remove("dirty");setStatus(t("st.fieldSaved"),false);
    return;
  }
  if(b.dataset.act==="addc"||b.dataset.act==="delc"){
    if(!currentData.contact||typeof currentData.contact!=="object")currentData.contact={};
    if(b.dataset.act==="delc"){const k=b.dataset.k;delete currentData.contact[k];dirtyPaths.delete("contact."+k);currentData.hide=arr(currentData.hide).filter(h=>h!=="c:"+k);buildForm();refresh(true);return}
    const k=$("newContactKey").value.replace(/[.\s]+/g," ").trim();
    if(!k){showToast(t("err.contactName"),2500);return}
    if(k in currentData.contact){showToast(t("err.contactExists"),2500);return}
    currentData.contact[k]="";dirtyPaths.add("contact."+k);buildForm();refresh(true);
    const f=[...formEl.querySelectorAll("[data-p]")].find(i=>i.dataset.p==="contact."+k);if(f)f.focus();
    return;
  }
  const key=b.dataset.l,L=LISTS[key]; if(!L)return;
  if(!Array.isArray(currentData[key]))currentData[key]=[];
  if(b.dataset.act==="mv"){
    const i=+b.dataset.i,j=i+ +b.dataset.d,A=currentData[key];
    if(j<0||j>=A.length)return;
    [A[i],A[j]]=[A[j],A[i]];if(L.h)swapHide(L.h,i,j);
    dirtyPaths.clear();buildForm();refresh(true);return;
  }
  const isAdd=b.dataset.act==="add", g=(b.closest(".fe-sec")||{dataset:{}}).dataset.g;
  if(isAdd)currentData[key].push(L.t());
  else{const i=+b.dataset.i;currentData[key].splice(i,1);if(L.h)dropHide(L.h,i);dirtyPaths.clear()}
  if(isAdd){
    /* il nuovo elemento è l'ultimo: i suoi campi sono "da confermare" */
    const n=currentData[key].length-1;
    formEl.dataset.pendingNew=key+"."+n;
  }
  buildForm();refresh(true);
  if(isAdd){
    const pre=formEl.dataset.pendingNew+"."; delete formEl.dataset.pendingNew;
    const last=formEl.querySelector(`.fe-sec[data-g="${g}"]`);
    const item=last&&[...last.querySelectorAll(".fe-item")].pop();
    if(item)item.querySelectorAll("[data-p]").forEach(x=>{dirtyPaths.add(x.dataset.p);const ok=x.closest(".fe-in").querySelector(".fe-ok");if(ok)ok.classList.add("dirty")});
  }
});
formEl.addEventListener("toggle",e=>{
  const g=e.target.dataset&&e.target.dataset.g; if(!g)return;
  e.target.open?openForm.add(g):openForm.delete(g);
},true);

const anyOpen=root=>[...root.querySelectorAll("details")].some(x=>x.open);
function updateFoldLabels(){
  $("btnFold").textContent=t(anyOpen(panelEl)?"foldAll":"unfoldAll");
  $("btnFoldForm").textContent=t(anyOpen(formEl)?"foldAll":"unfoldAll");
}
function toggleFold(root){
  const open=anyOpen(root);
  root.querySelectorAll("details").forEach(x=>{x.open=!open});
  updateFoldLabels();
}
$("btnFold").onclick=e=>{e.preventDefault();e.stopPropagation();toggleFold(panelEl)};
$("btnFoldForm").onclick=()=>toggleFold(formEl);
document.addEventListener("toggle",updateFoldLabels,true);

$("btnHeadFold").onclick=()=>{
  const closed=$("editorHeader").classList.toggle("closed");
  $("btnHeadFold").setAttribute("aria-expanded",String(!closed));
};

function setTab(m){
  formEl.hidden=(m!=="form"); $("jsonWrap").hidden=(m!=="json"); $("btnFoldForm").hidden=(m!=="form");
  ["form","json"].forEach(k=>$("tab_"+k).classList.toggle("active",k===m));
  if(m==="json")hlUpdate();
  if(m==="form")updateFoldLabels();
}
["form","json"].forEach(k=>$("tab_"+k).onclick=()=>setTab(k));

const VIEWS=["edit","prev","set"];
function setView(v){
  document.body.dataset.view=v;
  document.body.style.setProperty("--cur",VIEWS.indexOf(v));
  document.querySelectorAll(".mnav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  updatePreviewLayout();
}
document.querySelectorAll(".mnav button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
addEventListener("resize",updatePreviewLayout);
$("btnPdfM").onclick=()=>{if(!$("btnPdf").disabled)exportPdf()};

function applyI18n(){
  document.documentElement.lang=uiLang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{el.title=t(el.dataset.i18nTitle)});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=t(el.dataset.i18nPh)});
  document.querySelectorAll(".lang-btn[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===uiLang));
  pageGuides.title=t("pageEnd");
}
function relocalize(){
  applyI18n();
  buildLists();
  buildPresetSel();
  buildForm();
  refresh(false);
  renderErr();
}
document.querySelectorAll(".lang-btn[data-lang]").forEach(b=>b.onclick=()=>{
  uiLang=b.dataset.lang;
  try{localStorage.setItem("ui-lang",uiLang)}catch(e){}
  relocalize();
  setStatus(t("ready"),false);
});

relocalize();
setTab("json");
setView("edit");
refresh(true);
histPush();
setStatus(t("ready"),false);
</script>
</body>
