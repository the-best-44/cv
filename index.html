.t-ats .stat-value{color:var(--ink);margin-right:.3em}
.t-ats .section-title{color:var(--ink);border-bottom:1px solid var(--ink);letter-spacing:.1em}
.t-ats .entry-date{color:var(--ink)}

.t-ats .bullets li:before{border-radius:50%;background:var(--ink);width:.26em;height:.26em}
.t-editorial .head{flex-direction:column;text-align:center;gap:0;padding:1em 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.t-editorial h1{font-size:2.5em;font-weight:700;letter-spacing:.02em}

.t-editorial .stat{flex:none;text-align:center;border-left:0;padding:0 1.4em}
.t-editorial .stat-value{color:var(--ink)}
.t-editorial .section-title{display:flex;align-items:center;gap:1em;border:0;padding-bottom:0;color:var(--accent);letter-spacing:.2em}
.t-editorial .section-title:before,.t-editorial .section-title:after{content:'';flex:1;height:1px;background:var(--rule)}
.t-editorial .entry-date{font-style:italic;font-weight:400;color:var(--soft)}
.t-editorial .bullets li:before{width:.22em;height:.22em;border-radius:50%;background:var(--ink)}
.t-compact h1{font-size:2em}
.t-compact .head{padding-bottom:.6em;border-bottom:3px solid var(--accent)}
.t-compact .role{letter-spacing:.08em;font-size:.92em}
.t-compact .stats{border:0;padding:0;margin-top:.7em}
.t-compact .stat{padding:0 .9em}
.t-compact .section-title{position:relative;color:var(--accent);border-bottom:1px solid var(--rule);letter-spacing:.12em}
.t-compact .section-title:after{content:'';position:absolute;left:0;bottom:-1px;width:2.6em;height:2px;background:var(--accent)}
.t-compact .entry{margin-bottom:calc(.6em*var(--sp))}
.t-compact .bullets li{margin-bottom:.05em}
.t-compact .entry-date{color:var(--soft);font-weight:700}
.t-sidebar{display:grid;grid-template-columns:37% 1fr;background:var(--bg)}
.t-sidebar .main-col{grid-column:2;grid-row:1;padding:calc(var(--pad)*.9) var(--pad) calc(var(--pad)*1.1) calc(var(--pad)*.85);min-width:0}
.t-sidebar .sidebar{grid-column:1;grid-row:1;background:var(--band);color:var(--band-text);padding:calc(var(--pad)*.9) calc(var(--pad)*.6)}
.t-sidebar .head{display:block}
.t-sidebar h1{font-family:'Playfair Display',serif;font-weight:700;font-size:2.4em;letter-spacing:0}
.t-sidebar .role{letter-spacing:.14em;font-size:.88em}
.t-sidebar .availability{font-style:normal;font-size:.95em;margin-top:.35em}
.t-sidebar .head-rule{width:4.5em;height:2px;background:var(--accent);margin-top:1em}
.t-sidebar .stats{border-top:0;padding-top:.2em}
.t-sidebar .main-col{counter-reset:sec}
.t-sidebar .main-col .section{counter-increment:sec;margin-top:calc(1.5em*var(--sp))}
.t-sidebar .main-col .section-title{display:flex;align-items:baseline;border:0;padding:0;color:var(--ink);letter-spacing:.16em}
.t-sidebar .main-col .section-title:before{content:counter(sec,decimal-leading-zero);font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:1.55em;letter-spacing:0;color:var(--accent);margin-right:.55em}
.t-sidebar .profil-text{color:var(--soft)}

.t-sidebar .sidebar .avatar{margin:0 auto 1.8em;--b:8.5em;border-color:var(--accent-light)}
.side-block{margin-bottom:1.7em}
.side-label{font-size:.8em;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:.8em}

.t-modern .m-head .stat-value{color:var(--accent-light)}
.t-modern .main{padding:calc(var(--pad)*.6) calc(var(--pad)*.6) var(--pad) var(--pad)}
.t-modern .aside{background:var(--tint);padding:calc(var(--pad)*.6) var(--pad) var(--pad) calc(var(--pad)*.6)}
.t-modern .section-title{border-bottom:1px solid var(--rule)}
.t-modern .links-col{display:flex;flex-direction:column;gap:.3em;color:var(--accent);word-break:break-all}
.t-modern .side-item strong{font-size:.9em;text-transform:uppercase;letter-spacing:.08em;color:var(--ink)}
.t-modern .side-list li{margin-bottom:.2em}
.page:not(.t-minimal):not(.t-sidebar) .head>div:first-child,.t-modern .m-top>div:first-child{flex:1;min-width:0}
.page:not(.t-minimal) .head .avatar,.t-modern .m-top .avatar{margin-right:var(--ave,0mm)}
.av-left:not(.t-minimal) .head .avatar,.t-modern.av-left .m-top .avatar{order:-1;margin-right:0;margin-left:var(--ave,0mm)}
.t-sidebar.av-left .sidebar .avatar{margin-left:0;margin-right:auto}
.t-sidebar.av-right .sidebar .avatar{margin-left:auto;margin-right:0}

.letter{padding:calc(var(--pad)*1.15) calc(var(--pad)*1.25);min-height:297mm;display:flex;flex-direction:column;font-size:1.04em;color:var(--soft)}

<style>
[hidden]{display:none!important}

.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}

  photoHint:["La photo importée depuis ton appareil n'est jamais enregistrée (ni dans les presets, ni dans le JSON) et disparaît au rechargement de la page. Un lien (URL) de photo, lui, est conservé dans le JSON et les presets : la photo réapparaît à chaque ouverture. Les deux sont inclus dans le PDF et l'export HTML. Pour le PDF, le site qui héberge l'image doit autoriser son chargement (CORS) ; sinon, importe la photo depuis ton appareil. Le texte du CV reste lisible par les ATS.","A photo imported from your device is never saved (neither in presets nor in the JSON) and disappears when you reload the page. A photo link (URL), on the other hand, is kept in the JSON and presets: the photo shows again every time you open it. Both are included in the PDF and the HTML export. For the PDF, the site hosting the image must allow it to be loaded (CORS); otherwise import the photo from your device. The CV text stays readable by ATS.","La foto caricata dal dispositivo non viene mai salvata (né nei preset né nel JSON) e sparisce se ricarichi la pagina. Un link (URL) alla foto, invece, viene conservato nel JSON e nei preset: la foto riappare a ogni apertura. Entrambe sono incluse nel PDF e nell'export HTML. Per il PDF, il sito che ospita l'immagine deve permetterne il caricamento (CORS); altrimenti carica la foto dal dispositivo. Il testo del CV resta leggibile dagli ATS."],

let hist=[], hi=-1, histLock=false, histTimer;
const updUndo=()=>{$("btnUndo").disabled=hi<=0;$("btnRedo").disabled=hi>=hist.length-1};
function persist(){ try{ localStorage.setItem("cv-autosave",JSON.stringify({d:lite(currentData),p:currentPreset})); }catch(e){} }
function histPush(){
  if(histLock)return;
  const s=JSON.stringify(currentData); if(hist[hi]===s)return;
  hist=hist.slice(0,hi+1); hist.push(s); if(hist.length>100)hist.shift(); hi=hist.length-1;
  updUndo(); persist();
}
const histSched=()=>{clearTimeout(histTimer);histTimer=setTimeout(histPush,500)};
function histGo(n){
  clearTimeout(histTimer); histPush();

const PAGE_W_PX=210*96/25.4, PAGE_H_PX=297*96/25.4;
const SHEET_GAP=24;
let lastK=1, lastPages=1;
const onePageOn=()=>docMode==="cv"&&currentData.onePage!==false;
function fitPage(el,enabled){
  el.style.transform="none"; el.style.width=PAGE_W_PX+"px"; el.style.minHeight=PAGE_H_PX+"px";
  let k=1;
  // Il testo non scende mai sotto MIN_BODY_PX: se non basta, il CV passa a 2 pagine
  const minK=Math.min(1,Math.max(.70,MIN_BODY_PX/styleOf(currentData).size));
  if(enabled && el.offsetHeight>PAGE_H_PX+1){
    let ok=false;
    for(let s=.98;s>=minK-1e-9;s-=.02){
      el.style.width=(PAGE_W_PX/s)+"px"; el.style.minHeight=(PAGE_H_PX/s)+"px";
      if(el.offsetHeight<=PAGE_H_PX/s+1){k=s;ok=true;break}
    }
    if(!ok){k=minK;el.style.width=(PAGE_W_PX/k)+"px";el.style.minHeight=(PAGE_H_PX/k)+"px"}
  }
  return k;
}
function updatePreviewLayout(){
  const k=fitPage(preview,onePageOn()), h=preview.offsetHeight*k;
  preview.style.transform=k<1?`scale(${k})`:"none";
  const pages=Math.max(1,Math.ceil((h-2)/PAGE_H_PX)), total=pages*PAGE_H_PX+(pages-1)*SHEET_GAP;
  const bg=styleOf(currentData).bg, s0=$("sheet0");
  pageBox.querySelectorAll(".sheet.clone").forEach(x=>x.remove());
  for(let i=1;i<pages;i++){
    const sh=document.createElement("div"); sh.className="sheet clone"; sh.style.background=bg; sh.dataset.pg=(i+1)+" / "+pages;
    const c=preview.cloneNode(true); c.removeAttribute("id"); c.style.top=(-i*PAGE_H_PX)+"px";
    sh.appendChild(c); pageBox.appendChild(sh);
  }
  s0.style.background=bg; s0.dataset.pg=pages>1?"1 / "+pages:"";
  pageBox.style.width=PAGE_W_PX+"px"; pageBox.style.height=total+"px"; pageBox.style.setProperty("--ch",h+"px");
  const avail=pageBox.parentElement.clientWidth-(innerWidth<=960?24:40), m=(avail>100&&avail<PAGE_W_PX)?avail/PAGE_W_PX:1;
  pageBox.style.transformOrigin="0 0"; pageBox.style.transform=m<1?`scale(${m})`:"none";
  pageBox.style.marginRight=m<1?`${-PAGE_W_PX*(1-m)}px`:"0"; pageBox.style.marginBottom=m<1?`${-total*(1-m)}px`:"0";
  lastK=k; lastPages=pages;
  pageInfo.textContent=pages+" "+t(pages>1?"pageMany":"pageOne")+(k<1?" · "+Math.round(k*100)+"%":"");
  pageInfo.className=pages>1?"warn":"";
}

const selSv = new Set();

function saveCurrent(name){

function renderSaved(){

  const sv=getSaved();

    const b=!!PRESETS[k], x=b?null:sv.find(v=>"u:"+v.id===k);
    if(!b&&!x)return "";

    const sub=b?t("builtinBadge"):`${t("theme."+themeOf(x.data||{}))} · ${new Date(x.ts).toLocaleString(uiLang)}`;

    const acts=editing
      ?`<button type="button" class="primary" data-sv="rnok" data-k="${esc(k)}">${esc(t("confirm"))}</button><button type="button" data-sv="rncancel" data-k="${esc(k)}">${esc(t("cancel"))}</button>`
      :`<button type="button" data-sv="load" data-k="${esc(k)}">${esc(t("load"))}</button>${b?"":`<button type="button" data-sv="rn" data-k="${esc(k)}">${esc(t("rename"))}</button>`}<button type="button" class="sv-del" data-sv="del" data-k="${esc(k)}">${esc(t("del"))}</button>`;
    return `<div class="sv-item${k===currentPreset?" cur":""}${selSv.has(k)?" sel":""}"><input type="checkbox" data-sel="${esc(k)}" ${selSv.has(k)?"checked":""}><div class="sv-info">${nm}<small>${esc(sub)}</small></div><div class="sv-acts">${acts}</div></div>`;
  }).join(""):`<p class="hint">${esc(t("savedEmpty"))}</p>`;

function deleteKeys(keys){
  const wasCur=keys.includes(currentPreset);
  const us=keys.filter(k=>k.startsWith("u:")), bs=keys.filter(k=>!k.startsWith("u:"));
  if(us.length)putSaved(getSaved().filter(v=>!us.includes("u:"+v.id)));
  if(bs.length)putHidden([...new Set([...getHidden(),...bs])]);
  keys.forEach(k=>selSv.delete(k));
  if(renameKey&&keys.includes(renameKey))renameKey=null;
  if(wasCur){const rest=allKeys();loadPreset(rest[0]||"elivie");dirtyPaths.clear();buildForm();refresh(true)}
  buildPresetSel();renderSaved();setStatus(t("st.deleted"),false);
}
function commitRename(){
  const inp=$("savedList").querySelector(".sv-rename"); if(!inp)return;
  const k=inp.dataset.k, nm=inp.value.trim();
  if(!nm){showToast(t("err.nameEmpty"),2500);return}
  const a=getSaved(), x=a.find(v=>"u:"+v.id===k);
  if(!x){renameKey=null;renderSaved();return}

const STOP=new Set(("les des une aux par pour dans sur avec sans que qui quoi dont est sont etre avoir ont plus tres vous nous notre votre vos nos leur leurs cette cet ces ainsi aussi mais donc car comme entre chez vers sous lors afin tout tous toute toutes pouvez serez sera fait faire etc poste offre entreprise profil missions mission annees years anni "+

"gli delle degli della dei del dal dalla dalle nel nella nelle sul sulla con che chi non una uno sono essere avere abbiamo siamo come anche piu molto ogni tra fra suo sua suoi loro nostro nostra vostro vostra presso questa questo questi queste cui dove quando oltre sulle alla alle agli nei nell dell all sull").split(" "));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const toks=s=>norm(s).split(/[^a-z0-9+#]+/).filter(w=>w.length>=3||(w.length===2&&/[+#]/.test(w)));
const stem=w=>w.length>3?w.replace(/(s|x)$/,""):w;
function keywordsOf(txt){
  const m=new Map();let i=0;
  toks(txt).forEach(w=>{
    if(STOP.has(w)||/^\d+$/.test(w))return;
    const s=stem(w),e=m.get(s);
    if(e)e.n++;else m.set(s,{s,w,n:1,i:i++});
  });
  return [...m.values()].sort((a,b)=>b.n-a.n||a.i-b.i).slice(0,30);
}
function cvPlain(d){
  const tmp=document.createElement("div");
  tmp.innerHTML=RENDERERS[themeOf(d)](d).replace(/<img[^>]*>/g,"");
  return tmp.textContent||"";
}
const hexOk=h=>/^#[0-9a-f]{6}$/i.test(h||"");
const lum=h=>{const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function strs(o,out){
  if(typeof o==="string")out.push(o);
  else if(Array.isArray(o))o.forEach(x=>strs(x,out));
  else if(o&&typeof o==="object")Object.values(o).forEach(x=>strs(x,out));
  return out;
}
function renderAts(){
  const rep=$("atsReport"),kw=$("atsKw"); if(!rep||!kw)return;
  const d=currentData,th=themeOf(d),s=styleOf(d),a=accentOf(d),it=[];
  const two=th==="sidebar"||th==="modern", atsTh=["ats","editorial","compact"].includes(th);
  // layout
  it.push(two?["warn",t("ats.layoutWarn")]:atsTh?["ok",t("ats.layoutAts")]:["ok",t("ats.layoutOk")]);
  // contrasto
  const pairs=[["ctr.body",s.text,s.bg,4.5],["ctr.ink",s.ink,s.bg,4.5],["ctr.accent",a,s.bg,3]];
  if(["sidebar","bold","modern"].includes(th)){
    pairs.push(["ctr.band",s.bandText,s.band,4.5]);
    pairs.push(["ctr.accentBand",th==="sidebar"?a:mix(a,.5),s.band,3]);
  }
  const bad=pairs.filter(p=>hexOk(p[1])&&hexOk(p[2])&&ratio(p[1],p[2])<p[3]);
  it.push(bad.length?["bad",t("ats.contrastBad",{l:bad.map(p=>`${t(p[0])} ${ratio(p[1],p[2]).toFixed(1)}:1 (min ${p[3]}:1)`).join(" ; ")})]:["ok",t("ats.contrastOk")]);
  // dimensione effettiva del corpo testo
  const px=s.size*lastK, pxs=(Math.round(px*10)/10).toString();
  it.push(px<8.5?["bad",t("ats.sizeBad",{px:pxs,m:MIN_BODY_PX})]:px<MIN_BODY_PX?["warn",t("ats.sizeWarn",{px:pxs,m:MIN_BODY_PX})]:["ok",t("ats.sizeOk",{px:pxs})]);
  // pagine
  if(lastPages>2)it.push(["warn",t("ats.pagesWarn",{n:lastPages})]);
  // contatti
  const c=contactObj(d), okC=k=>show(d,"contact")&&show(d,"c:"+k)&&has(cval(c[k]));
  if(!(okC("email")&&okC("phone")))it.push(["warn",t("ats.contactBad")]);
  // segnaposto [..] rimasti
  const found=[...new Set((strs([d.role,d.profile,d.experience,d.projects,d.skills,d.formation,d.letter],[]).join("\n").match(/\[[^\]\n]{1,40}\]/g))||[])];
  if(found.length)it.push(["warn",t("ats.placeholder",{l:found.slice(0,4).join(" ")})]);
  // foto con design ATS
  if(atsTh&&photoSrc(d)&&show(d,"avatar"))it.push(["warn",t("ats.photoAts")]);
  // profilo troppo lungo
  if(has(d.profile)&&d.profile.length>650)it.push(["warn",t("ats.profileLong",{n:d.profile.length})]);
  rep.innerHTML=it.map(([l,m])=>`<div class="ats-item ${l}"><i>${l==="ok"?"✓":l==="warn"?"!":"✕"}</i><span>${esc(m)}</span></div>`).join("");
  // parole chiave dell'offerta
  const ks=keywordsOf($("jobText").value);
  if(!ks.length){kw.innerHTML=`<p class="hint">${esc(t("atsKwEmpty"))}</p>`;return}
  const have=new Set(toks(cvPlain(d)).map(stem));
  const f=ks.filter(k=>have.has(k.s)), m=ks.filter(k=>!have.has(k.s));
  const chips=(l,c)=>l.map(k=>`<span class="kw-chip ${c}">${esc(k.w)}</span>`).join("");
  kw.innerHTML=`<div class="kw-sum">${esc(t("atsKwSummary",{f:f.length,n:ks.length}))}</div>`
    +(m.length?`<div class="kw-h">${esc(t("atsMissing",{n:m.length}))}</div><div class="kw-chips">${chips(m,"no")}</div>`:"")
    +(f.length?`<div class="kw-h">${esc(t("atsFound",{n:f.length}))}</div><div class="kw-chips">${chips(f,"ok")}</div>`:"");
}

const jsonHl=$("jsonHl");
const e2=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const jsonRe=/("(?:\\.|[^"\\])*")(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
function hlLine(text){
  jsonRe.lastIndex=0;
  let out="",last=0,m;
  while((m=jsonRe.exec(text))){
    out+=e2(text.slice(last,m.index));
    if(m[1]!==undefined)out+=`<span class="${m[2]?"jk":"js"}">${e2(m[1])}</span>`+(m[2]?e2(m[2]):"");
    else out+=`<span class="${/^-?\d/.test(m[0])?"jn":"jb"}">${m[0]}</span>`;
    last=jsonRe.lastIndex;
  }
  return out+e2(text.slice(last));
}
function hlJson(text){
  const rows=text.split("\n").map((ln,i)=>{
    const h=hlLine(ln)||" ";
    return (jsonErr&&jsonErr.line===i+1)?`<span class="jl-err">${h}</span>`:h;
  });
  return rows.join("\n")+"\n ";
}
function syncHl(){jsonHl.scrollTop=jsonInput.scrollTop;jsonHl.scrollLeft=jsonInput.scrollLeft}
function hlUpdate(){jsonHl.innerHTML=hlJson(jsonInput.value);syncHl()}
function setJson(v){jsonInput.value=v;hlUpdate()}
jsonInput.addEventListener("scroll",syncHl);

const indexOfLC=(text,l,c)=>{const ls=text.split("\n");let i=0;for(let k=0;k<l-1&&k<ls.length;k++)i+=ls[k].length+1;return i+c-1};
const lcOfIndex=(text,i)=>{const b=text.slice(0,i).split("\n");return [b.length,b[b.length-1].length+1]};
function parseJsonError(text,err){
  const message=String(err&&err.message||err);
  const lc=message.match(/line (\d+) column (\d+)/), pm=message.match(/position (\d+)/);
  let idx=pm?+pm[1]:lc?indexOfLC(text,+lc[1],+lc[2]):-1, trailing=false;
  if(idx>=0&&/[}\]]/.test(text[idx]||"")){
    let j=idx-1;while(j>=0&&/\s/.test(text[j]))j--;
    if(j>=0&&text[j]===","){idx=j;trailing=true}
  }
  const [line,col]=idx>=0?lcOfIndex(text,idx):[0,0];
  return {message,line,col,trailing};
}

const MM=96/25.4;
function isBlankRow(ctx,w,row,bg){const d=ctx.getImageData(0,row,w,1).data;for(let i=0;i<d.length;i+=4){if(Math.abs(d[i]-bg[0])>6||Math.abs(d[i+1]-bg[1])>6||Math.abs(d[i+2]-bg[2])>6)return false}return true}
function findCut(ctx,w,y,end,back,bg){let run=0;for(let r=end-1;r>end-back&&r>y+60;r--){if(isBlankRow(ctx,w,r,bg)){run++;if(run>=4)return r+2}else run=0}return end}
function collectLayer(doc){
  const words=[],links=[],win=doc.defaultView,walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT),rng=doc.createRange();let n;
  while((n=walker.nextNode())){
    const tx=n.nodeValue;if(!tx.trim()||!n.parentElement)continue;
    const cs=win.getComputedStyle(n.parentElement);if(cs.visibility==="hidden"||cs.display==="none")continue;
    const re=/\S+/g;let m;
    while((m=re.exec(tx))){
      rng.setStart(n,m.index);rng.setEnd(n,m.index+m[0].length);
      const b=rng.getClientRects()[0];if(!b||!b.width)continue;
      let s=m[0];if(cs.textTransform==="uppercase")s=s.toUpperCase();else if(cs.textTransform==="lowercase")s=s.toLowerCase();
      s=s.replace(/[^\u0020-\u00FF\u20AC\u2013\u2014\u2018\u2019\u201C\u201D\u2022]/g,"");if(!s)continue;
      words.push({s,x:b.left,top:b.top,bottom:b.bottom,w:b.width,fs:parseFloat(cs.fontSize)||12,bold:parseInt(cs.fontWeight,10)>=600});
    }
  }
  doc.querySelectorAll("a[href]").forEach(a=>{
    const href=a.getAttribute("href")||"";if(!/^(https?:|mailto:|tel:)/i.test(href))return;
    Array.from(a.getClientRects()).forEach(b=>{if(b.width>1&&b.height>1)links.push({url:href,x:b.left,top:b.top,w:b.width,h:b.height})});
  });
  return {words,links};
}
function addLayer(pdf,layer,k,y0,y1){
  const PT=72/25.4;
  layer.words.forEach(w=>{
    const mid=(w.top+w.bottom)/2;if(mid<y0||mid>=y1)return;
    pdf.setFont("helvetica",w.bold?"bold":"normal");pdf.setFontSize(w.fs*k*PT);
    const tw=pdf.getTextWidth(w.s),cs=w.s.length>1?(w.w*k-tw)/(w.s.length-1):0;
    pdf.text(w.s+" ",w.x*k,(w.bottom-y0)*k,{baseline:"bottom",renderingMode:"invisible",charSpace:cs});
  });
  layer.links.forEach(l=>{const mid=l.top+l.h/2;if(mid<y0||mid>=y1)return;pdf.link(l.x*k,(l.top-y0)*k,l.w*k,l.h*k,{url:l.url})});
}

let urlPhotoCache={u:"",d:""};
async function pdfPhoto(){
  if(photoData)return photoData;
  const u=(currentData.avatarUrl||"").trim();
  if(!/^https?:\/\//i.test(u)||!show(currentData,"avatar"))return /^data:image\//i.test(u)?u:"";
  if(urlPhotoCache.u===u&&urlPhotoCache.d)return urlPhotoCache.d;
  try{
    const r=await fetch(u,{mode:"cors"});if(!r.ok)throw new Error("http");
    const b=await r.blob();
    const d=await new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});
    urlPhotoCache={u,d};return d;
  }catch(e){showToast(t("st.pdfPhotoFail"),5500);return ""}
}
async function exportPdf(){
  const btn=$("btnPdf");btn.disabled=true;setStatus(t("st.pdfBuilding"),false);let holder=null;
  try{
    if(!window.html2canvas||!window.jspdf)throw new Error(t("st.pdfLibs"));
    const PW=210,PH=297,W=Math.ceil(PW*MM);
    const photo=await pdfPhoto();
    holder=document.createElement("iframe");
    holder.setAttribute("sandbox","allow-same-origin");holder.setAttribute("aria-hidden","true");
    holder.style.cssText=`position:fixed;left:-20000px;top:0;border:0;width:${W}px;height:10px`;
    let pdfHtml;
    pdfPhotoOverride=photo;
    try{pdfHtml=buildStandaloneHtml(currentData,true)}finally{pdfPhotoOverride=null}
    await new Promise((res,rej)=>{holder.onload=res;holder.onerror=rej;holder.srcdoc=pdfHtml;document.body.appendChild(holder)});
    const doc=holder.contentDocument;
    if(doc.fonts&&doc.fonts.ready)await doc.fonts.ready;
    await Promise.all(Array.from(doc.images).map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));
    const k=fitPage(doc.querySelector(".page"),onePageOn()),Wn=Math.ceil(PAGE_W_PX/k);
    holder.style.width=Wn+"px";holder.style.height="10px";
    const H=Math.max(Math.ceil(doc.documentElement.scrollHeight),20);holder.style.height=H+"px";
    const layer=collectLayer(doc),scale=Math.max(1,Math.min(2,30000/H));
    const canvas=await window.html2canvas(doc.documentElement,{scale,backgroundColor:"#ffffff",width:Wn,height:H,windowWidth:Wn,windowHeight:H,useCORS:true,logging:false});
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:[PW,PH],orientation:"portrait",compress:true});
    pdf.setProperties({title:docTitle(currentData),author:FIXED.fullName});
    const cw=canvas.width,chh=canvas.height,pagePx=Math.floor(cw*PH/PW),mmPerPx=PW/Wn;
    const ctx=canvas.getContext("2d",{willReadFrequently:true}),bg=ctx.getImageData(0,0,1,1).data;
    let y=0,first=true,pages=0;
    while(y<chh-1){
      let end=Math.min(chh,y+pagePx);
      if(chh-y-pagePx<4*scale)end=chh;else if(end<chh)end=findCut(ctx,cw,y,end,Math.floor(pagePx*.18),bg);
      const sh=end-y,part=document.createElement("canvas");
      part.width=cw;part.height=sh;
      const pc=part.getContext("2d");pc.fillStyle="#ffffff";pc.fillRect(0,0,cw,sh);pc.drawImage(canvas,0,y,cw,sh,0,0,cw,sh);
      if(!first)pdf.addPage([PW,PH],"portrait");first=false;
      pdf.addImage(part.toDataURL("image/jpeg",.95),"JPEG",0,0,PW,sh*PW/cw,undefined,"FAST");
      addLayer(pdf,layer,mmPerPx,y/scale,end/scale);pages++;y=end;
    }
    const name=fileBase(currentData)+".pdf",a=document.createElement("a");
    a.href=URL.createObjectURL(pdf.output("blob"));a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    setStatus(t("st.pdfReady",{n:name,p:pages+" "+t(pages>1?"pageMany":"pageOne")}),false);
  }catch(err){
    const m=err&&err.message?err.message:t("st.pdfFail");setStatus("❌ "+m,true);showToast("❌ "+m,4000);
  }finally{pdfPhotoOverride=null;if(holder&&holder.parentNode)holder.parentNode.removeChild(holder);btn.disabled=false}
}

  if(b.dataset.act==="addc"||b.dataset.act==="delc"){
    if(!currentData.contact||typeof currentData.contact!=="object")currentData.contact={};
    if(b.dataset.act==="delc"){const k=b.dataset.k;delete currentData.contact[k];dirtyPaths.delete("contact."+k);currentData.hide=arr(currentData.hide).filter(h=>h!=="c:"+k);buildForm();refresh(true);return}
    const k=$("newContactKey").value.replace(/[.\s]+/g," ").trim();
    if(!k){showToast(t("err.contactName"),2500);return}
    if(k in currentData.contact){showToast(t("err.contactExists"),2500);return}
    currentData.contact[k]="";dirtyPaths.add("contact."+k);buildForm();refresh(true);
    const f=[...formEl.querySelectorAll("[data-p]")].find(i=>i.dataset.p==="contact."+k);if(f)f.focus();
    return;
  }
  const key=b.dataset.l,L=LISTS[key]; if(!L)return;
  if(!Array.isArray(currentData[key]))currentData[key]=[];
  if(b.dataset.act==="mv"){
    const i=+b.dataset.i,j=i+ +b.dataset.d,A=currentData[key];
    if(j<0||j>=A.length)return;
    [A[i],A[j]]=[A[j],A[i]];if(L.h)swapHide(L.h,i,j);
    dirtyPaths.clear();buildForm();refresh(true);return;
  }
  const isAdd=b.dataset.act==="add", g=(b.closest(".fe-sec")||{dataset:{}}).dataset.g;
  if(isAdd)currentData[key].push(L.t());
  else{const i=+b.dataset.i;currentData[key].splice(i,1);if(L.h)dropHide(L.h,i);dirtyPaths.clear()}
  buildForm();refresh(true);
  if(isAdd){
    const last=formEl.querySelector(`.fe-sec[data-g="${g}"]`);
    const item=last&&[...last.querySelectorAll(".fe-item")].pop();
    if(item)item.querySelectorAll("[data-p]").forEach(x=>{dirtyPaths.add(x.dataset.p);const ok=x.closest(".fe-in").querySelector(".fe-ok");if(ok)ok.classList.add("dirty")});
  }
});
formEl.addEventListener("toggle",e=>{
  const g=e.target.dataset&&e.target.dataset.g; if(!g)return;
  e.target.open?openForm.add(g):openForm.delete(g);
},true);

const anyOpen=root=>[...root.querySelectorAll("details")].some(x=>x.open);
function updateFoldLabels(){
  $("btnFold").textContent=t(anyOpen(panelEl)?"foldAll":"unfoldAll");
  $("btnFoldForm").textContent=t(anyOpen(formEl)?"foldAll":"unfoldAll");
}
function toggleFold(root){
  const open=anyOpen(root);
  root.querySelectorAll("details").forEach(x=>{x.open=!open});
  updateFoldLabels();
}
$("btnFold").onclick=e=>{e.preventDefault();e.stopPropagation();toggleFold(panelEl)};
$("btnFoldForm").onclick=()=>toggleFold(formEl);
document.addEventListener("toggle",updateFoldLabels,true);

$("btnHeadFold").onclick=()=>{
  const closed=$("editorHeader").classList.toggle("closed");
  $("btnHeadFold").setAttribute("aria-expanded",String(!closed));
};

function setTab(m){
  formEl.hidden=(m!=="form"); $("jsonWrap").hidden=(m!=="json"); $("btnFoldForm").hidden=(m!=="form");
  ["form","json"].forEach(k=>$("tab_"+k).classList.toggle("active",k===m));
  if(m==="json")hlUpdate();
  if(m==="form")updateFoldLabels();
}
["form","json"].forEach(k=>$("tab_"+k).onclick=()=>setTab(k));

const VIEWS=["edit","prev","set"];
function setView(v){
  document.body.dataset.view=v;
  document.body.style.setProperty("--cur",VIEWS.indexOf(v));
  document.querySelectorAll(".mnav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  updatePreviewLayout();
}
document.querySelectorAll(".mnav button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
addEventListener("resize",updatePreviewLayout);
$("btnPdfM").onclick=()=>{if(!$("btnPdf").disabled)exportPdf()};

function applyI18n(){
  document.documentElement.lang=uiLang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{el.title=t(el.dataset.i18nTitle)});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=t(el.dataset.i18nPh)});
  document.querySelectorAll(".lang-btn[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===uiLang));
  pageGuides.title=t("pageEnd");
}
function relocalize(){
  applyI18n();
  buildLists();
  buildPresetSel();
  buildForm();
  refresh(false);
  renderErr();
  if(!$("savedModal").hidden)renderSaved();
}
document.querySelectorAll(".lang-btn[data-lang]").forEach(b=>b.onclick=()=>{
  uiLang=b.dataset.lang;
  try{localStorage.setItem("ui-lang",uiLang)}catch(e){}
  relocalize();
  setStatus(t("ready"),false);
});

// Pulizia: elimina eventuali foto in base64 salvate dalle versioni precedenti
(function purgeOldPhotos(){
  const a=getSaved();
  const dirty=a.some(x=>x&&(x.photo||(x.data&&/^data:/i.test(x.data.avatarUrl||""))));
  if(!dirty)return;
  putSaved(a.map(x=>{
    if(x){delete x.photo;if(x.data&&/^data:/i.test(x.data.avatarUrl||""))x.data.avatarUrl=""}
    return x;
  }));
})();
try{$("jobText").value=localStorage.getItem("cv-job")||""}catch(e){}

relocalize();
setTab("json");
setView("edit");
refresh(true);
histPush();
setStatus(t("ready"),false);
</script>
</body>
