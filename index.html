<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Generator - Multi-designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Lato:wght@400;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style id="cv-styles">
:root { --accent: #1d5c63; }
* { box-sizing: border-box; margin: 0; padding: 0; }
.page { font-family: 'Lato', sans-serif; width: 210mm; min-height: 297mm; background: #fff; color: #2b2b28; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.page a { color: inherit; text-decoration: none; }
.page ul { list-style: none; }

/* ============ THEME : PDF (colonne unique, bandeau de chiffres) ============ */
.theme-pdf { --ink:#1b2430; --soft:#4a5563; --rule:#dfe4ea; --tint:#f3f6f8; padding: 14mm 16mm; font-family:'Inter',sans-serif; }
.theme-pdf h1 { font-size: 30px; font-weight: 800; color: var(--ink); letter-spacing: -0.5px; }
.theme-pdf .role { margin-top: 4px; font-size: 12.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--accent); }
.theme-pdf .contact-line { margin-top: 8px; font-size: 11.5px; color: var(--soft); }
.theme-pdf .links-line { margin-top: 3px; font-size: 11.5px; color: var(--accent); display:flex; flex-wrap:wrap; gap:4px 14px; }
.theme-pdf .availability { margin-top: 6px; font-size: 11.5px; color: var(--soft); font-style: italic; }
.theme-pdf .stats { display:grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 16px 0 6px; }
.theme-pdf .stat { background: var(--tint); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 3px; }
.theme-pdf .stat-value { font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1; }
.theme-pdf .stat-label { margin-top: 4px; font-size: 10.5px; line-height: 1.35; color: var(--soft); }
.theme-pdf .section { margin-top: 15px; }
.theme-pdf .section-title { font-size: 11.5px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); padding-bottom: 5px; margin-bottom: 9px; border-bottom: 1.5px solid var(--accent); }
.theme-pdf .section-num { display:none; }
.theme-pdf .profil-text { font-size: 12px; line-height: 1.6; color: var(--soft); }
.theme-pdf .entry { margin-bottom: 11px; }
.theme-pdf .entry-head { display:flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.theme-pdf .entry-title { font-size: 13px; font-weight: 700; color: var(--ink); }
.theme-pdf .entry-date { font-size: 11px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.theme-pdf .entry-org { font-size: 11.5px; font-style: italic; color: var(--soft); }
.theme-pdf .bullets { margin-top: 4px; }
.theme-pdf .bullets li { position: relative; padding-left: 12px; font-size: 11.5px; line-height: 1.5; color: var(--soft); margin-bottom: 2px; }
.theme-pdf .bullets li::before { content:''; position:absolute; left:0; top:7px; width:4px; height:4px; border-radius:50%; background: var(--accent); }
.theme-pdf .bullets li strong { color: var(--ink); }
.theme-pdf .skills-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
.theme-pdf .skill-name { font-size: 11.5px; font-weight: 700; color: var(--ink); }
.theme-pdf .skill-value { font-size: 11px; line-height: 1.4; color: var(--soft); }
.theme-pdf .two-cols { display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.theme-pdf .formation-title { font-size: 12.5px; font-weight: 700; color: var(--ink); }
.theme-pdf .formation-school { font-size: 11px; color: var(--soft); }
.theme-pdf .formation-year { font-size: 10.5px; font-weight: 700; color: var(--accent); }
.theme-pdf .chips { display:flex; flex-wrap:wrap; gap: 6px; }
.theme-pdf .chip { font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--tint); color: var(--accent); border: 1px solid var(--rule); }

/* ============ THEME : SIDEBAR (design d'origine, vert & or) ============ */
.theme-sidebar { --sidebar-bg:#1f2e26; --sidebar-text:#e8e4d8; --sidebar-muted:#9fae9f; --paper-bg:#f7f3ea; --ink:#2b2b28; --ink-soft:#55534c; --gold: var(--accent); --rule:#d8d0bd; background: var(--paper-bg); display:grid; grid-template-columns: 290px 1fr; }
.theme-sidebar .sidebar { background: var(--sidebar-bg); color: var(--sidebar-text); padding: 38px 28px; }
.theme-sidebar .avatar { width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--gold); margin: 0 auto 28px; overflow: hidden; }
.theme-sidebar .avatar img { width:100%; height:100%; object-fit: cover; }
.theme-sidebar .side-block { margin-bottom: 26px; }
.theme-sidebar .side-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 10px; }
.theme-sidebar .side-item { font-size: 12.5px; line-height: 1.5; margin-bottom: 9px; }
.theme-sidebar .side-item strong { color: #fff; display:block; }
.theme-sidebar .side-links { display:flex; flex-direction:column; gap: 7px; font-size: 12.5px; }
.theme-sidebar .formation-entry { border-left: 2px solid var(--gold); padding-left: 12px; margin-bottom: 14px; }
.theme-sidebar .formation-year { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.theme-sidebar .formation-title { font-size: 13px; font-weight: 700; color: #fff; }
.theme-sidebar .formation-school { font-size: 12px; color: var(--sidebar-muted); margin-top: 2px; }
.theme-sidebar .side-chips li { font-size: 12.5px; margin-bottom: 4px; }
.theme-sidebar .side-chips li::before { content:'— '; color: var(--gold); }
.theme-sidebar .content { padding: 42px 42px; }
.theme-sidebar h1 { font-family:'Playfair Display', serif; font-size: 32px; font-weight: 600; color: var(--ink); }
.theme-sidebar .role { color: var(--gold); font-size: 12.5px; letter-spacing: 2.2px; text-transform: uppercase; font-weight: 700; margin-top: 4px; }
.theme-sidebar .availability { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
.theme-sidebar .header-rule { width: 60px; height: 2px; background: var(--gold); margin: 16px 0 22px; }
.theme-sidebar .stats { display:flex; gap: 20px; margin-bottom: 22px; }
.theme-sidebar .stat-value { font-family:'Playfair Display',serif; font-size: 24px; color: var(--gold); line-height:1; }
.theme-sidebar .stat-label { font-size: 10.5px; color: var(--ink-soft); line-height: 1.35; margin-top: 3px; max-width: 120px; }
.theme-sidebar .section { margin-bottom: 24px; }
.theme-sidebar .section-title { display:flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.theme-sidebar .section-num { font-family:'Playfair Display',serif; font-style: italic; color: var(--gold); font-size: 19px; }
.theme-sidebar .section-name { font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 700; color: var(--ink); }
.theme-sidebar .profil-text { font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
.theme-sidebar .entry { position: relative; padding-left: 18px; margin-bottom: 18px; border-left: 1px solid var(--rule); }
.theme-sidebar .entry::before { content:''; position:absolute; left:-5px; top:4px; width:9px; height:9px; border-radius:50%; background: var(--paper-bg); border: 2px solid var(--gold); }
.theme-sidebar .entry-date { font-size: 11px; letter-spacing: 1.5px; color: var(--gold); font-weight: 700; }
.theme-sidebar .entry-title { font-size: 14.5px; font-weight: 700; color: var(--ink); }
.theme-sidebar .entry-org { font-size: 12.5px; font-style: italic; color: var(--ink-soft); }
.theme-sidebar .bullets { margin-top: 6px; padding-left: 14px; list-style: disc; }
.theme-sidebar .bullets li { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 3px; }
.theme-sidebar .bullets li::marker { color: var(--gold); }
.theme-sidebar .entry-head { display:block; }
.theme-sidebar .skills-grid, .theme-sidebar .two-cols { display:block; }

/* ============ THEME : MODERN (bandeau sombre + colonne claire) ============ */
.theme-modern { --ink:#14202b; --soft:#475666; --rule:#e2e8ee; --tint:#eef2f6; font-family:'Inter',sans-serif; display:grid; grid-template-columns: 1fr 70mm; grid-template-rows: auto 1fr; }
.theme-modern .m-head { grid-column: 1 / -1; background: #14202b; color:#fff; padding: 14mm 16mm 9mm; }
.theme-modern .m-head h1 { font-size: 31px; font-weight: 800; letter-spacing:-0.5px; }
.theme-modern .m-head .role { margin-top: 5px; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-light, #7fd1d8); }
.theme-modern .m-head .availability { margin-top: 6px; font-size: 11.5px; color: #b9c4cf; }
.theme-modern .m-head .stats { display:flex; gap: 26px; margin-top: 14px; }
.theme-modern .m-head .stat-value { font-size: 21px; font-weight: 800; color: #fff; line-height:1; }
.theme-modern .m-head .stat-label { font-size: 10px; color: #b9c4cf; margin-top: 3px; max-width: 130px; line-height: 1.3; }
.theme-modern .main { padding: 8mm 8mm 12mm 16mm; }
.theme-modern .aside { background: var(--tint); padding: 8mm 10mm 12mm 8mm; }
.theme-modern .section { margin-bottom: 15px; }
.theme-modern .section-title { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; display:flex; align-items:center; gap:8px; }
.theme-modern .section-title::after { content:''; flex:1; height:1px; background: var(--rule); }
.theme-modern .section-num { display:none; }
.theme-modern .profil-text { font-size: 11.8px; line-height: 1.6; color: var(--soft); }
.theme-modern .entry { margin-bottom: 11px; padding-left: 11px; border-left: 2px solid var(--accent); }
.theme-modern .entry-head { display:block; }
.theme-modern .entry-title { font-size: 12.8px; font-weight: 700; color: var(--ink); }
.theme-modern .entry-org { font-size: 11.3px; color: var(--soft); font-style: italic; }
.theme-modern .entry-date { font-size: 10.5px; font-weight: 700; color: var(--accent); }
.theme-modern .bullets { margin-top: 4px; }
.theme-modern .bullets li { position:relative; padding-left: 11px; font-size: 11.2px; line-height:1.5; color: var(--soft); margin-bottom: 2px; }
.theme-modern .bullets li::before { content:'›'; position:absolute; left:0; color: var(--accent); font-weight:800; }
.theme-modern .bullets li strong { color: var(--ink); }
.theme-modern .skills-grid, .theme-modern .two-cols { display:block; }
.theme-modern .skill { margin-bottom: 8px; }
.theme-modern .skill-name { font-size: 11px; font-weight: 700; color: var(--ink); }
.theme-modern .skill-value { font-size: 10.8px; line-height: 1.4; color: var(--soft); }
.theme-modern .side-item { font-size: 11px; color: var(--soft); margin-bottom: 5px; word-break: break-word; }
.theme-modern .side-item strong { display:block; color: var(--ink); font-size: 10px; letter-spacing:1px; text-transform: uppercase; }
.theme-modern .formation-title { font-size: 11.8px; font-weight: 700; color: var(--ink); }
.theme-modern .formation-school { font-size: 10.8px; color: var(--soft); }
.theme-modern .formation-year { font-size: 10.3px; font-weight:700; color: var(--accent); }
.theme-modern .formation-entry { margin-bottom: 8px; }
.theme-modern .chips { display:flex; flex-wrap:wrap; gap: 5px; }
.theme-modern .chip { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background:#fff; color: var(--accent); border: 1px solid var(--rule); }
.theme-modern .links-col { display:flex; flex-direction:column; gap: 4px; font-size: 10.8px; color: var(--accent); word-break: break-all; }

/* ============ THEME : MINIMAL (sobre, noir & blanc) ============ */
.theme-minimal { --ink:#111; --soft:#444; --rule:#cfcfcf; font-family:'Lato',sans-serif; padding: 16mm 18mm; }
.theme-minimal h1 { font-family:'Playfair Display',serif; font-size: 34px; font-weight: 500; color: var(--ink); text-align:center; }
.theme-minimal .role { text-align:center; margin-top: 4px; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--soft); }
.theme-minimal .contact-line, .theme-minimal .links-line, .theme-minimal .availability { text-align:center; font-size: 11.3px; color: var(--soft); margin-top: 5px; justify-content:center; }
.theme-minimal .links-line { display:flex; flex-wrap:wrap; gap: 4px 14px; }
.theme-minimal .stats { display:flex; justify-content:center; gap: 34px; margin: 14px 0 4px; padding: 10px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.theme-minimal .stat { text-align:center; }
.theme-minimal .stat-value { font-family:'Playfair Display',serif; font-size: 22px; color: var(--ink); line-height:1; }
.theme-minimal .stat-label { font-size: 10px; color: var(--soft); margin-top: 3px; max-width: 150px; line-height:1.3; }
.theme-minimal .section { margin-top: 15px; }
.theme-minimal .section-title { font-size: 11.5px; letter-spacing: 3px; text-transform: uppercase; font-weight: 900; color: var(--ink); margin-bottom: 8px; border-bottom: 1px solid var(--ink); padding-bottom: 3px; }
.theme-minimal .section-num { display:none; }
.theme-minimal .profil-text { font-size: 12px; line-height: 1.6; color: var(--soft); }
.theme-minimal .entry { margin-bottom: 10px; }
.theme-minimal .entry-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.theme-minimal .entry-title { font-size: 12.8px; font-weight: 700; color: var(--ink); }
.theme-minimal .entry-date { font-size: 11px; color: var(--soft); white-space: nowrap; }
.theme-minimal .entry-org { font-size: 11.5px; font-style: italic; color: var(--soft); }
.theme-minimal .bullets { margin-top: 3px; padding-left: 14px; list-style: disc; }
.theme-minimal .bullets li { font-size: 11.5px; line-height: 1.5; color: var(--soft); margin-bottom: 1px; }
.theme-minimal .bullets li strong { color: var(--ink); }
.theme-minimal .skills-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
.theme-minimal .skill-name { font-size: 11.5px; font-weight: 700; color: var(--ink); }
.theme-minimal .skill-value { font-size: 11px; color: var(--soft); line-height:1.4; }
.theme-minimal .two-cols { display:grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.theme-minimal .formation-title { font-size: 12.3px; font-weight: 700; color: var(--ink); }
.theme-minimal .formation-school, .theme-minimal .formation-year { font-size: 11px; color: var(--soft); }
.theme-minimal .chips { font-size: 11.3px; color: var(--soft); }
.theme-minimal .chip { display:inline; }
.theme-minimal .chip:not(:last-child)::after { content:'  ·  '; }

@media print { .page { box-shadow: none; } }
</style>

<style>
body { font-family:'Lato',sans-serif; background:#14181a; color:#d7dadb; display:flex; height:100vh; margin:0; overflow:hidden; }
.editor { width: 480px; flex-shrink:0; background:#1c2226; display:flex; flex-direction:column; border-right:1px solid #2a3236; }
.editor-header { padding:14px 18px; border-bottom:1px solid #2a3236; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
h2 { margin:0; color:#a8763c; font-size:14px; text-transform:uppercase; letter-spacing:1px; }
.btns { display:flex; gap:6px; flex-wrap:wrap; }
.controls { padding:12px 18px; border-bottom:1px solid #2a3236; display:flex; flex-direction:column; gap:10px; font-size:12.5px; color:#9aa3a7; }
.theme-picker { display:grid; grid-template-columns: repeat(4, 1fr); gap:6px; }
.theme-btn { padding:8px 4px; font-size:12px; text-align:center; }
.theme-btn.active { background:#a8763c; border-color:#a8763c; color:#fff; }
.color-row { display:flex; align-items:center; gap:10px; }
.color-row input[type=color] { width:36px; height:26px; border:none; background:none; padding:0; cursor:pointer; }
.swatches { display:flex; gap:6px; }
.swatch { width:20px; height:20px; border-radius:50%; border:2px solid #3a444a; cursor:pointer; padding:0; }
#jsonInput { flex:1; background:#0e1113; color:#c5e3c8; border:none; padding:16px; font-family:monospace; font-size:12.5px; line-height:1.5; resize:none; outline:none; }
.preview-wrap { flex:1; overflow:auto; padding:30px 20px; background:#0f1214; display:flex; justify-content:center; align-items:flex-start; }
button { background:#2a3236; color:#d7dadb; border:1px solid #3a444a; border-radius:4px; padding:7px 11px; cursor:pointer; font-family:inherit; font-size:12.5px; }
button:hover { background:#3a444a; }
#status { padding:10px 18px; font-size:12px; border-top:1px solid #2a3236; }
#status.ok { color:#7fbf82; }
#status.error { color:#d9776a; }
#toast { position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-12px); background:#3a1f1f; color:#f2b8ae; border:1px solid #6b3630; padding:10px 18px; border-radius:6px; font-size:13px; max-width:80vw; text-align:center; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:1000; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.page-box { position: relative; flex-shrink: 0; }
.page-box .page { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.page-guides { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(to bottom, transparent 0, transparent calc(297mm - 2px), #e11d48 calc(297mm - 2px), #e11d48 297mm);
  -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 14px);
  mask-image: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 14px); }
.check-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.check-row input { accent-color:#a8763c; }
#pageInfo { margin-left:auto; font-weight:700; color:#7fbf82; }
#pageInfo.warn { color:#e0a84f; }

@media print {
  @page { size: A4; margin: 0; }
  .page-guides { display:none !important; }
  .page-box { width:210mm !important; }
  body { display:block; height:auto; overflow:visible; background:#fff; }
  .editor, #toast { display:none !important; }
  .preview-wrap { padding:0; overflow:visible; display:block; background:#fff; }
  .page { box-shadow:none; margin:0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<div class="editor">
  <div class="editor-header">
    <h2>Éditeur CV</h2>
    <div class="btns">
      <button id="btnReset" title="Revenir aux données par défaut">Réinitialiser</button>
      <button id="btnCopy">📋 Copier HTML</button>
      <button id="btnDownload">⬇️ HTML</button>
      <button id="btnPdf" title="Télécharge un vrai PDF A4 (texte sélectionnable, liens cliquables)">⬇️ PDF</button>
      <button id="btnPrint" title="Alternative : impression du navigateur">🖨️</button>
    </div>
  </div>

  <div class="controls">
    <div>Design</div>
    <div class="theme-picker" id="themePicker"></div>
    <div class="color-row">
      <span>Couleur d'accent</span>
      <input type="color" id="accentInput" value="#1d5c63">
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="check-row">
      <input type="checkbox" id="onePage" checked>
      <label for="onePage">Tout tenir sur 1 page (réduit légèrement si besoin)</label>
      <span id="pageInfo"></span>
    </div>
  </div>

  <textarea id="jsonInput" spellcheck="false"></textarea>
  <div id="status">Prêt</div>
</div>

<div class="preview-wrap">
  <div class="page-box" id="pageBox">
    <div class="page theme-pdf" id="preview"></div>
    <div class="page-guides" id="pageGuides" title="Fin de page A4"></div>
  </div>
</div>

<div id="toast"></div>

function accentOf(d) { return /^#[0-9a-f]{6}$/i.test(d.accent || "") ? d.accent : THEMES[themeOf(d)].accent; }

function renderCV(d) {

  preview.style.setProperty("--accent-light", lighten(accentOf(d)));

}

function lighten(hex) {
  const n = parseInt(hex.slice(1), 16);
  const mix = v => Math.round(v + (255 - v) * 0.55);
  const r = mix(n >> 16), g = mix((n >> 8) & 255), b = mix(n & 255);
  return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
}

}

/* ---------- Mise en page A4 : 1 page si possible, repères de fin de page ---------- */
const PAGE_W_PX = 210 * 96 / 25.4, PAGE_H_PX = 297 * 96 / 25.4;

const onePageOn = () => currentData.onePage !== false;

// Élargit la zone de mise en page (puis le tout est rétréci) jusqu'à ce que ça tienne sur 1 page.
function fitPage(el, enabled) {
  el.style.transform = "none";
  el.style.width = PAGE_W_PX + "px";
  el.style.minHeight = PAGE_H_PX + "px";
  let k = 1;
  if (enabled && el.offsetHeight > PAGE_H_PX + 1) {
    let ok = false;
    for (let t = 0.98; t >= 0.70; t -= 0.02) {
      el.style.width = (PAGE_W_PX / t) + "px";
      el.style.minHeight = (PAGE_H_PX / t) + "px";
      if (el.offsetHeight <= PAGE_H_PX / t + 1) { k = t; ok = true; break; }
    }
    if (!ok) {
      k = 0.70;
      el.style.width = (PAGE_W_PX / k) + "px";
      el.style.minHeight = (PAGE_H_PX / k) + "px";
    }
  }
  return k;
}

function updatePreviewLayout() {
  const k = fitPage(preview, onePageOn());
  const h = preview.offsetHeight * k;
  preview.style.transform = k < 1 ? `scale(${k})` : "none";
  pageBox.style.width = PAGE_W_PX + "px";
  pageBox.style.height = h + "px";
  pageGuides.style.height = h + "px";
  const pages = Math.max(1, Math.ceil((h - 2) / PAGE_H_PX));
  pageInfo.textContent = pages + (pages === 1 ? " page" : " pages") + (k < 1 ? " · réduit à " + Math.round(k * 100) + "%" : "");
  pageInfo.className = pages > 1 ? "warn" : "";
}

/* ---------- Export PDF réel (html2canvas + jsPDF) ---------- */
const MM = 96 / 25.4;

function isBlankRow(ctx, w, row, bg) {
  const d = ctx.getImageData(0, row, w, 1).data;
  for (let i = 0; i < d.length; i += 4) {
    if (Math.abs(d[i] - bg[0]) > 6 || Math.abs(d[i+1] - bg[1]) > 6 || Math.abs(d[i+2] - bg[2]) > 6) return false;
  }
  return true;
}
function findCut(ctx, w, y, end, back, bg) {
  let run = 0;
  for (let r = end - 1; r > end - back && r > y + 60; r--) {
    if (isBlankRow(ctx, w, r, bg)) { run++; if (run >= 4) return r + 2; } else run = 0;
  }
  return end;
}

// Position de chaque mot et de chaque lien dans l'iframe (px CSS)
function collectLayer(doc) {
  const words = [], links = [], win = doc.defaultView;
  const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
  const rng = doc.createRange();
  let n;
  while ((n = walker.nextNode())) {
    const t = n.nodeValue;
    if (!t.trim() || !n.parentElement) continue;
    const cs = win.getComputedStyle(n.parentElement);
    if (cs.visibility === "hidden" || cs.display === "none") continue;
    const re = /\S+/g; let m;
    while ((m = re.exec(t))) {
      rng.setStart(n, m.index); rng.setEnd(n, m.index + m[0].length);
      const b = rng.getClientRects()[0];
      if (!b || !b.width) continue;
      let s = m[0];
      if (cs.textTransform === "uppercase") s = s.toUpperCase();
      else if (cs.textTransform === "lowercase") s = s.toLowerCase();
      s = s.replace(/[^\u0020-\u00FF\u20AC\u2013\u2014\u2018\u2019\u201C\u201D\u2022]/g, "");
      if (!s) continue;
      words.push({ s, x: b.left, top: b.top, bottom: b.bottom, w: b.width,
        fs: parseFloat(cs.fontSize) || 12, bold: parseInt(cs.fontWeight, 10) >= 600 });
    }
  }
  doc.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href") || "";
    if (!/^(https?:|mailto:|tel:)/i.test(href)) return;
    Array.from(a.getClientRects()).forEach(b => {
      if (b.width > 1 && b.height > 1) links.push({ url: href, x: b.left, top: b.top, w: b.width, h: b.height });
    });
  });
  return { words, links };
}

// Texte invisible (sélectionnable, lisible par les ATS) + zones de liens cliquables
function addLayer(pdf, layer, k, y0, y1) {
  const PT = 72 / 25.4;
  layer.words.forEach(w => {
    const mid = (w.top + w.bottom) / 2;
    if (mid < y0 || mid >= y1) return;
    pdf.setFont("helvetica", w.bold ? "bold" : "normal");
    pdf.setFontSize(w.fs * k * PT);
    const tw = pdf.getTextWidth(w.s);
    const cs = w.s.length > 1 ? (w.w * k - tw) / (w.s.length - 1) : 0;
    pdf.text(w.s + " ", w.x * k, (w.bottom - y0) * k, { baseline: "bottom", renderingMode: "invisible", charSpace: cs });
  });
  layer.links.forEach(l => {
    const mid = l.top + l.h / 2;
    if (mid < y0 || mid >= y1) return;
    pdf.link(l.x * k, (l.top - y0) * k, l.w * k, l.h * k, { url: l.url });
  });
}

async function exportPdf() {
  const btn = document.getElementById("btnPdf");
  btn.disabled = true;
  setStatus("Création du PDF…", false);
  let holder = null;
  try {
    if (!window.html2canvas || !window.jspdf) throw new Error("Librairies PDF non chargées : vérifie ta connexion et recharge la page.");

    const PW = 210, PH = 297;
    const W = Math.ceil(PW * MM);
    holder = document.createElement("iframe");
    holder.setAttribute("sandbox", "allow-same-origin");
    holder.setAttribute("aria-hidden", "true");
    holder.style.cssText = `position:fixed;left:-20000px;top:0;border:0;width:${W}px;height:10px`;
    await new Promise((res, rej) => {
      holder.onload = res; holder.onerror = rej;
      holder.srcdoc = buildStandaloneHtml(currentData, true);
      document.body.appendChild(holder);
    });
    const doc = holder.contentDocument;
    if (doc.fonts && doc.fonts.ready) await doc.fonts.ready;
    await Promise.all(Array.from(doc.images).map(i => i.decode ? i.decode().catch(() => {}) : Promise.resolve()));

    // Même mise en page que l'aperçu : 1 page si possible
    const k = fitPage(doc.querySelector(".page"), onePageOn());
    const Wn = Math.ceil(PAGE_W_PX / k);
    holder.style.width = Wn + "px";
    holder.style.height = "10px";
    const H = Math.max(Math.ceil(doc.documentElement.scrollHeight), 20);
    holder.style.height = H + "px";
    const layer = collectLayer(doc);

    const scale = Math.max(1, Math.min(2, 30000 / H));
    const canvas = await window.html2canvas(doc.documentElement, {
      scale, backgroundColor: "#ffffff", width: Wn, height: H,
      windowWidth: Wn, windowHeight: H, useCORS: true, logging: false
    });

    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: [PW, PH], orientation: "portrait", compress: true });
    const cw = canvas.width, chh = canvas.height;
    const pagePx = Math.floor(cw * PH / PW);
    const mmPerPx = PW / Wn;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const bg = ctx.getImageData(0, 0, 1, 1).data;
    let y = 0, first = true, pages = 0;
    while (y < chh - 1) {
      let end = Math.min(chh, y + pagePx);
      if (chh - y - pagePx < 4 * scale) end = chh;           // évite une page presque vide
      else if (end < chh) end = findCut(ctx, cw, y, end, Math.floor(pagePx * 0.18), bg);
      const sh = end - y;
      const part = document.createElement("canvas");
      part.width = cw; part.height = sh;
      const pc = part.getContext("2d");
      pc.fillStyle = "#ffffff"; pc.fillRect(0, 0, cw, sh);
      pc.drawImage(canvas, 0, y, cw, sh, 0, 0, cw, sh);
      if (!first) pdf.addPage([PW, PH], "portrait");
      first = false;
      pdf.addImage(part.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, PW, sh * PW / cw, undefined, "FAST");
      addLayer(pdf, layer, mmPerPx, y / scale, end / scale);
      pages++;
      y = end;
    }

    const name = "CV-" + FIXED.fullName.replace(/\s+/g, "-") + ".pdf";
    const blob = pdf.output("blob");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    setStatus(`✅ PDF prêt : ${name} (${pages} page${pages > 1 ? "s" : ""})`, false);
  } catch (err) {
    setStatus("❌ " + (err && err.message ? err.message : "Impossible de créer le PDF"), true);
    showToast("❌ " + (err && err.message ? err.message : "Impossible de créer le PDF"), 4000);
  } finally {
    if (holder && holder.parentNode) holder.parentNode.removeChild(holder);
    btn.disabled = false;
  }
}
document.getElementById("btnPdf").onclick = exportPdf;

// Chargement initial (reprend la dernière sauvegarde si elle existe)
try {
  const saved = localStorage.getItem("cv-data");
  if (saved) {
    const parsed = JSON.parse(saved);
    if (parsed && Array.isArray(parsed.experience)) currentData = parsed;
  }
} catch (e) {}
refresh(true);
</script>
